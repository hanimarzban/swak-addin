name: Build & Release SWAK Setup

on:
  push:
    tags:
      - 'v*'          # مثلاً: v2.0.0 → release میسازه
  workflow_dispatch:  # دستی از GitHub UI هم میتونی اجرا کنی
    inputs:
      version:
        description: 'Version (e.g. 2.0.1)'
        required: false
        default: '2.0.0'

permissions:
  contents: write   # برای آپلود به Releases

jobs:
  build:
    runs-on: windows-latest

    steps:
      # ─── 1. Checkout ────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ─── 2. Python 3.11 ─────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ─── 3. Install dependencies ────────────────────────────────────────
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r swak/server/requirements.txt
        shell: pwsh

      # ─── 4. Cython compile ──────────────────────────────────────────────
      - name: Compile modules with Cython
        run: |
          cd swak
          python build/build.py
        shell: pwsh

      # ─── 5. PyInstaller → swak_runtime.exe ─────────────────────────────
      - name: Build executable with PyInstaller
        run: |
          cd swak
          pyinstaller build/swak_runtime.spec
        shell: pwsh

      # ─── 6. Inno Setup → SWAK_Runtime_Setup_vX.X.X.exe ─────────────────
      - name: Install Inno Setup
        run: |
          choco install innosetup --yes --no-progress
        shell: pwsh

      - name: Determine version
        id: version
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $v = "${{ github.ref_name }}" -replace '^v', ''
          } else {
            $v = "${{ github.event.inputs.version }}"
            if (-not $v) { $v = "2.0.0" }
          }
          echo "VERSION=$v" >> $env:GITHUB_OUTPUT
          echo "Version: $v"
        shell: pwsh

      - name: Build installer with Inno Setup
        run: |
          $v = "${{ steps.version.outputs.VERSION }}"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DAppVersion=$v `
            swak/build/swak_installer.iss
        shell: pwsh

      # ─── 7. Upload to GitHub Release ────────────────────────────────────
      - name: Create GitHub Release and upload installer
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.version.outputs.VERSION) }}
          name: SWAK Data Tools v${{ steps.version.outputs.VERSION }}
          body: |
            ## SWAK Data Tools Runtime v${{ steps.version.outputs.VERSION }}

            ### نصب
            1. فایل `SWAK_Runtime_Setup_v${{ steps.version.outputs.VERSION }}.exe` را دانلود کنید
            2. اجرا کنید و مراحل نصب را دنبال کنید
            3. Add-in اکسل را فعال کنید

            ### دانلود مستقیم
            لینک همیشگی آخرین نسخه:
            ```
            https://github.com/${{ github.repository }}/releases/latest/download/SWAK_Runtime_Setup_latest.exe
            ```
          draft: false
          prerelease: false
          files: |
            swak/dist/SWAK_Runtime_Setup_v${{ steps.version.outputs.VERSION }}.exe

      # ─── 8. Upload "latest" copy (برای لینک ثابت) ──────────────────────
      - name: Copy installer as "latest"
        run: |
          $v = "${{ steps.version.outputs.VERSION }}"
          Copy-Item "swak/dist/SWAK_Runtime_Setup_v$v.exe" `
                    "swak/dist/SWAK_Runtime_Setup_latest.exe"
        shell: pwsh

      - name: Upload "latest" to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.version.outputs.VERSION) }}
          files: swak/dist/SWAK_Runtime_Setup_latest.exe
