// ── SUPABASE CONFIG ──
const SUPABASE_URL = 'https://apklqlvcwrtjdcfuplyr.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_qA95KQ4tCv3-7thy1f3vFg_gpllE61P';

// ── DEVICE FINGERPRINT (stable, never stored) ──
// Computed live on every call - cannot be spoofed from localStorage
function getDeviceFingerprint() {
  try {
    const nav = window.navigator;
    const screen = window.screen;
    
    // Collect stable hardware signals
    const components = [
      nav.userAgent,
      nav.language,
      nav.platform,
      nav.hardwareConcurrency || '',
      nav.maxTouchPoints || '',
      screen.width + 'x' + screen.height,
      screen.colorDepth,
      screen.pixelDepth,
      Intl.DateTimeFormat().resolvedOptions().timeZone || '',
      nav.languages ? nav.languages.join(',') : '',
    ];

    // Try to get Office-specific stable identifiers
    if(typeof Office !== 'undefined' && Office.context) {
      try {
        const host = Office.context.host || '';
        const platform = Office.context.platform || '';
        components.push(host, platform);
      } catch(e){}
    }

    // Hash with FNV-1a for a stable 64-bit fingerprint
    const raw = components.join('|||');
    let h1 = 0x811c9dc5, h2 = 0x811c9dc5;
    for(let i = 0; i < raw.length; i++) {
      const ch = raw.charCodeAt(i);
      h1 ^= ch; h1 = Math.imul(h1, 0x01000193);
      h2 ^= ch; h2 = Math.imul(h2, 0x01000193) ^ (i * 31);
    }
    // Return as 64-char hex string (min length 32 for server validation)
    const fp = (h1 >>> 0).toString(16).padStart(8,'0') +
               (h2 >>> 0).toString(16).padStart(8,'0') +
               btoa(raw.slice(0,48)).replace(/[^a-zA-Z0-9]/g,'').slice(0,48);
    return fp;
  } catch(e) {
    // Fallback: use navigator.userAgent hash only
    const raw = navigator.userAgent + navigator.language + screen.width;
    let h = 0;
    for(let i = 0; i < raw.length; i++) h = Math.imul(h ^ raw.charCodeAt(i), 0x01000193);
    return (h >>> 0).toString(16).padStart(8,'0').repeat(8).slice(0,64);
  }
}

let licenseState = {

// ── SUPABASE RPC CALL (with timeout) ──
async function callSupabaseRPC(fnName, params = {}, timeoutMs = 8000) {
  const url = `${SUPABASE_URL}/rest/v1/rpc/${fnName}`;
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs);
  try {
    const resp = await fetch(url, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
      },
      body: JSON.stringify(params),
      signal: controller.signal,
    });
    clearTimeout(timer);
    if(!resp.ok) {
      const err = await resp.text();
      throw new Error(`RPC_${resp.status}`);
    }
    return resp.json();
  } catch(e) {
    clearTimeout(timer);
    if(e.name === 'AbortError') throw new Error('TIMEOUT');
    throw e;
  }
}

// ── VALIDATE LICENSE FROM SUPABASE ──
async function validateLicenseFromServer(key) {
  // Get live device fingerprint (never cached)
  const deviceId = getDeviceFingerprint();
  
  // Anti-spoofing check before sending
  if(!deviceId || deviceId.length < 32) {
    return { valid: false, error: 'INVALID_DEVICE', errorCode: 'INVALID_DEVICE' };
  }

  try {
    const result = await callSupabaseRPC('validate_license', {
      p_key: key,
      p_device_id: deviceId,
    });
    return {
      valid: result.valid || false,
      plan: result.plan || 'free',
      expiresAt: result.expires_at || null,
      daysRemaining: result.days_remaining || 0,
      userCount: result.seat_count || 1,
      error: result.error || null,
      errorCode: result.error_code || null,
      firstActivation: result.first_activation || false,
    };
  } catch(e) {
    // Network error
    if(!navigator.onLine || e.message.includes('fetch')) {
      return { valid: false, error: 'NETWORK_ERROR', errorCode: 'NETWORK_ERROR' };
    }
    return { valid: false, error: 'SERVER_ERROR', errorCode: 'SERVER_ERROR' };
  }
}

// SECURITY: Freeze licenseState after setting (prevents console override)
function applyServerLicense(serverResp, key) {
  // Stamp validation time + generate integrity token
  serverResp.lastValidated = Date.now();
  const tok = btoa((serverResp.plan||'free') + (key||'') + 'swak_v1_integrity').slice(0,16);
  serverResp._tok = tok;
  // Only this function can update licenseState
  if(serverResp.errorCode === 'INVALID_DEVICE') {
    showDeviceTamperingModal();
    return;
  }
  if(serverResp.valid) {
    licenseState = {
      valid: true,
      plan: serverResp.plan,
      expiresAt: serverResp.expiresAt,
      daysRemaining: serverResp.daysRemaining,
      userCount: serverResp.userCount,
      licenseKey: key,
      deviceId: getDeviceFingerprint(),
      lastValidated: Date.now(),
    };
    // Refresh lastValidated every 5 min to keep isPlanPro() returning true
    // (in production this is done by scheduleRevalidation)
    // Check if expired
    if(licenseState.daysRemaining <= 0) {
      licenseState.valid = false;
      licenseState.plan = 'free';
    }
  } else {
    licenseState = { valid: false, plan: 'free', expiresAt: null, daysRemaining: null, 
                     userCount: null, licenseKey: null, deviceId: null, lastValidated: null };
  }
  // Prevent console tampering: freeze the state object
  // Note: Object.freeze only prevents property modification, not reassignment of licenseState var
  // The real protection is that all UI reads go through isPlanPro() which checks daysRemaining
  Object.freeze(licenseState);
}

function isPlanPro() {
  // Server-authoritative check - multiple conditions must ALL pass
  if(!licenseState) return false;
  if(!licenseState.valid) return false;
  if(licenseState.plan === 'free' || !licenseState.plan) return false;
  if(licenseState.daysRemaining === null || licenseState.daysRemaining <= 0) return false;
  if(!licenseState.lastValidated) return false;
  // Prevent replay attacks: state must have been validated recently (within 6 min grace)
  const staleness = Date.now() - licenseState.lastValidated;
  if(staleness > 6 * 60 * 1000) return false;
  // Integrity token check: detects console tampering of licenseState
  if(licenseState._tok) {
    const expected = btoa((licenseState.plan||'') + (licenseState.licenseKey||'') + 'swak_v1_integrity').slice(0,16);
    if(licenseState._tok !== expected) {
      licenseState = { valid: false, plan: 'free', _tok: null };
      return false;
    }
  } else if(typeof Office !== 'undefined') {
    // In real add-in: no token = not validated by server = deny
    return false;
  }
  return true;
}

// Lock entire app - prevents all interaction
function lockApp(modalId) {
  // Already locked
  if(document.getElementById(modalId)) return;
  // Prevent clicks on frame
  const frame = document.getElementById('frame');
  if(frame) frame.style.pointerEvents = 'none';
}

function unlockApp() {
  const frame = document.getElementById('frame');
  if(frame) frame.style.pointerEvents = '';
}

  const frame = document.getElementById('frame');
  if(!frame) return;

  lockApp(id);
  const overlay = document.createElement('div');
  overlay.id = id;
  overlay.style.cssText = `position:fixed;inset:0;background:rgba(0,0,0,0.92);

// ── AUTH RESULT HANDLER ──
// Handles all 6 cases from startup/periodic/tool check
function handleAuthResult(resp, savedKey, afterSuccess) {
  if(!resp) {
    // Server timeout/no response
    updateConnectionStatus(false);
    showLockedModal({
      id: 'swak-server-timeout',
      icon: '⏱️',
      title: t('timeoutTitle')||'Server Not Responding',
      message: t('timeoutMsg')||'Swak servers are not responding. Please check your connection and try again.',
      color: '#6B7280',
      btn1Text: '🔄 '+(t('retryConnection')||'Try Again'),
      btn1Action: 'startupFlow()',
      btn2Text: '💬 '+(t('contactSupport')||'Contact Support'),
    });
    return;
  }

  const code = resp.errorCode || resp.error_code || null;

  // Case 5: Device fingerprint invalid/tampered
  if(code === 'INVALID_DEVICE') {
    updateConnectionStatus(false);
    showLockedModal({
      id: 'swak-device-error',
      icon: '🔐',
      title: t('deviceTamperTitle')||'Device ID Not Recognized',
      message: t('deviceTamperMsg')||'Your device hardware ID could not be identified or has been tampered with. The add-in is locked for security.',
      color: '#EF4444',
      btn1Text: '💬 '+(t('contactSupport')||'Contact Support'),
      btn1Action: "window.open('https://swaksoft.com/contact','_blank')",
    });
    return;
  }

  // Case 2: License not found in DB
  if(code === 'NOT_FOUND' || code === 'INVALID_KEY') {
    updateConnectionStatus(true);
    try { localStorage.removeItem('swak_license_key'); } catch(e){}
    showLockedModal({
      id: 'swak-invalid-license',
      icon: '🔑',
      title: t('keyErrorTitle')||'Invalid License',
      message: t('keyErrorMsg')||'The license stored on this device was not found. Please re-enter your license key.',
      color: '#F59E0B',
      btn1Text: t('enterLicense')||'Enter License Key',
      btn1Action: "show('keyinput')",
    });
    return;
  }

  // Case 3: License expired
  if(code === 'LICENSE_EXPIRED' || resp.errorCode === 'LICENSE_EXPIRED') {
    updateConnectionStatus(true);
    showLockedModal({
      id: 'swak-expired',
      icon: '⏰',
      title: t('expiredTitle')||'License Expired',
      message: t('expiredMsg')||'Your license has expired. Purchase a new license to continue using Swak Pro.',
      color: '#F59E0B',
      btn1Text: '🛒 '+(t('buyLicense')||'Buy New License'),
      btn1Action: "show('onboarding')",
      btn2Text: '💬 '+(t('contactSupport')||'Contact Support'),
    });
    return;
  }

  // Case 4: License active on another device
  if(code === 'DEVICE_CONFLICT') {
    updateConnectionStatus(true);
    try { localStorage.removeItem('swak_license_key'); } catch(e){}
    showLockedModal({
      id: 'swak-device-conflict',
      icon: '💻',
      title: t('deviceConflict')||'License On Another Device',
      message: t('deviceConflictMsg')||'This license is already activated on another computer. Please use your original device or contact support.',
      color: '#F59E0B',
      btn1Text: t('backToOnboarding')||'OK',
      btn1Action: "show('onboarding')",
      btn2Text: '💬 '+(t('contactSupport')||'Contact Support'),
    });
    return;
  }

  // License suspended or revoked
  if(code === 'LICENSE_SUSPENDED' || code === 'LICENSE_REVOKED') {
    updateConnectionStatus(true);
    showLockedModal({
      id: 'swak-license-blocked',
      icon: '🚫',
      title: code === 'LICENSE_SUSPENDED' ? (t('suspendedTitle')||'License Suspended') : (t('revokedTitle')||'License Revoked'),
      message: code === 'LICENSE_SUSPENDED' ? (t('suspendedMsg')||'Your license is temporarily suspended.') : (t('revokedMsg')||'Your license has been revoked.'),
      color: '#EF4444',
      btn1Text: '💬 '+(t('contactSupport')||'Contact Support'),
      btn1Action: "window.open('https://swaksoft.com/contact','_blank')",
    });
    return;
  }

  // Rate limited
  if(code === 'RATE_LIMITED') {
    updateConnectionStatus(true);
    showLockedModal({
      id: 'swak-rate-limited',
      icon: '🛡️',
      title: t('rateLimitTitle')||'Too Many Attempts',
      message: t('rateLimitMsg')||'Too many failed attempts. Please wait before trying again.',
      color: '#EF4444',
      btn1Text: t('contactSupport')||'Contact Support',
      btn1Action: "window.open('https://swaksoft.com/contact','_blank')",
    });
    return;
  }

  // Case 6: SUCCESS
  if(resp.valid) {
    updateConnectionStatus(true);
    applyServerLicense(resp, savedKey);
    if(typeof afterSuccess === 'function') afterSuccess();
    return;
  }

  // Unknown error
  updateConnectionStatus(false);
  showLockedModal({
    id: 'swak-server-error',
    icon: '⚠️',
    title: t('serverErrorTitle')||'Unexpected Error',
    message: t('serverErrorMsg')||'An unexpected error occurred. Please try again.',
    color: '#6B7280',
    btn1Text: '🔄 '+(t('retryConnection')||'Try Again'),
    btn1Action: 'startupFlow()',
    btn2Text: '💬 '+(t('contactSupport')||'Contact Support'),
  });
}

// ── PERIODIC LICENSE CHECK (every 5min, Pro only) ──
let _licenseCheckTimer = null;
function startLicensePolling(key) {
  if(_licenseCheckTimer) clearInterval(_licenseCheckTimer);
  _licenseCheckTimer = setInterval(async () => {
    if(!isPlanPro()) { stopLicensePolling(); return; }
    if(!navigator.onLine) { updateConnectionStatus(false); return; }
    try {
      const resp = await validateLicenseFromServer(key);
      if(!isPlanPro()) return; // user logged out during check
      handleAuthResult(resp, key, () => {
        // Still valid - update state silently
      });
    } catch(e) {
      updateConnectionStatus(false);
    }
  }, 5 * 60 * 1000); // 5 minutes
}

function stopLicensePolling() {
  if(_licenseCheckTimer) { clearInterval(_licenseCheckTimer); _licenseCheckTimer = null; }
}

// Called before every Pro tool execution
async function verifyLicenseBeforeRun(savedKey) {
  if(!navigator.onLine) {
    updateConnectionStatus(false);
    showLockedModal({
      id: 'swak-offline-wall',
      icon: '📡',
      title: t('offlineTitle')||'No Internet Connection',
      message: t('offlineDesc')||'Swak requires internet to verify your license.',
      color: '#6B7280',
      btn1Text: '🔄 '+(t('retryConnection')||'Retry'),
      btn1Action: 'startupFlow()',
    });
    return false;
  }
  try {
    const resp = await validateLicenseFromServer(savedKey);
    if(resp && resp.valid) {
      applyServerLicense(resp, savedKey);
      return true;
    }
    handleAuthResult(resp, savedKey, null);
    return false;
  } catch(e) {
    handleAuthResult(null, savedKey, null);
    return false;
  }
}

// ── INTERNET STATUS (native events) ──
window.addEventListener('online', () => {
  updateConnectionStatus(true);
  if(!appStarting) {
    const wall = document.getElementById('swak-offline-wall');
    if(wall) wall.remove();
    rf(currentScreen==='app-pro');
  }
});
window.addEventListener('offline', () => {
  updateConnectionStatus(false);
  if(!appStarting) showOfflineModal();
});

function showOfflineModal() {
  if(document.getElementById('swak-offline-wall')) return;
  rf(currentScreen==='app-pro');
}

function updateConnectionStatus(connected) {
  isConnected = connected;
  // Update all status indicators without full re-render
  document.querySelectorAll('.conn-dot').forEach(el => {
    el.style.background = connected ? '#4ADE80' : '#F87171';
  });
  document.querySelectorAll('.conn-text').forEach(el => {
    el.textContent = connected ? t('connected') : t('disconnected');
  });
}

// Periodic license re-validation (every 30 min in production)
// Prevents client-side tampering with licenseState
function scheduleRevalidation() {
  if(!licenseState.licenseKey) return;
  setTimeout(async () => {
    try {
      const resp = await validateLicenseFromServer(licenseState.licenseKey);
      applyServerLicense(resp, licenseState.licenseKey);
      updateConnectionStatus(resp.valid !== undefined);
      // If license expired, downgrade to free
      if(!isPlanPro() && currentScreen === 'app-pro') {
        showT('error', t('licenseExpired')||'License expired. Switching to Free plan.');
        setTimeout(()=>show('app'), 2000);
      }
      scheduleRevalidation();
    } catch(e) {
      updateConnectionStatus(false);
      scheduleRevalidation();
    }
  }, 5 * 60 * 1000); // 5 minutes
}

// ── TOTAL OPS COUNT ──
function fmtCurrency(amount, suffix){
  const num = toLocalDigits(amount);
  const suf = suffix ? toLocalDigits(suffix) : '';
  return (lang==='fa'||lang==='ar') ? num+'$'+(suf?'/'+suf:'') : '$'+num+(suf?'/'+suf:'');
}
function toLocalDigits(str){
  if(lang==='fa'){
    return String(str).replace(/[0-9]/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
  }
  if(lang==='ar'){
    return String(str).replace(/[0-9]/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
  }
  return String(str);
}
function totalOps(){
  // 312 = 51 tools × base + select operation modes + column configurations
  // This is the total number of distinct analytical operations available
  return 312;
}

function getToolLabel(tool) {
  if (lang === 'en') return tool.label;
  if (lang === 'fa') return tool.labelFa || tool.label;
  const lmap = TOOL_LABELS[tool.id];
  return (lmap && lmap[lang]) ? lmap[lang] : tool.label;
}

// ── HELPERS ──
function hl(text,q){
  if(!q)return text;
  const i=text.toLowerCase().indexOf(q.toLowerCase());
  if(i===-1)return text;
  return text.slice(0,i)+'<mark>'+text.slice(i,i+q.length)+'</mark>'+text.slice(i+q.length);
}
function getResults(q){
  if(!q.trim())return[];
  const ql=q.toLowerCase(),res=[];
  for(const tier of TIERS)
    for(const tool of tier.tools){
      const tlabel=getToolLabel(tool).toLowerCase();
      if(tool.label.toLowerCase().includes(ql)||tool.labelFa.toLowerCase().includes(ql)||tlabel.includes(ql)||tool.tags.some(tag=>tag.includes(ql)))
        res.push({tool,tier});
    }
  return res;
}

let paramValues = {};

function initParams(toolId) {
  const params = TOOL_PARAMS[toolId] || [];
  paramValues = {};
  params.forEach(p => {
    if(p.default !== undefined && p.default !== '') paramValues[p.key] = p.default;
  });
}

function handleColSelect(key, val, isPro) {
  if(val === '__custom__') {
    setParam(key, '__custom__');
  } else {
    setParam(key, val);
  }
  rf(isPro);
}

function setParam(key, val) {
  paramValues[key] = val;
}

function canRunTool(toolId) {
  const params = TOOL_PARAMS[toolId] || [];
  return params.filter(p => p.required).every(p => paramValues[p.key]);
}

async function retryConnection(){
  if(!navigator.onLine) {
    showErrorModal({
      icon:'📡',
      title: t('offlineTitle')||'No Internet Connection',
      message: t('offlineDesc')||'Swak requires internet to verify your license.',
      btnText: t('retryConnection')||'Retry',
      btnAction: 'retryConnection()',
      color:'#6B7280'
    });
    return;
  }
  document.getElementById('retry-spinner')?.style && (document.getElementById('retry-spinner').style.display='inline');
  try {
    if(licenseState.licenseKey){
      const resp = await validateLicenseFromServer(licenseState.licenseKey);
      applyServerLicense(resp, licenseState.licenseKey);
      updateConnectionStatus(true);
      rf(currentScreen==='app-pro');
    } else {
      // No key - just check server reachability
      await validateLicenseFromServer('SWAK-PING');
      updateConnectionStatus(true);
      rf(currentScreen==='app-pro');
    }
  } catch(e){
    updateConnectionStatus(false);
    showT('error', t('stillOffline')||'Still offline. Please check your internet connection.');
    rf(currentScreen==='app-pro');
  }
}

function renderToolPanel(tierId, toolId, isPro) {
  const isRtl=isRTL();
  const tier = TIERS.find(t=>t.id===tierId);
  const tool = tier?.tools.find(t=>t.id===toolId);
  if(!tool||!tier) return '';
  const params = TOOL_PARAMS[toolId] || [];
  const canRun = canRunTool(toolId);
  
  return`<div style="background:${C().bg};min-height:100%;display:flex;flex-direction:column;animation:slideRight .18s ease;direction:${isRTL()?'rtl':'ltr'}">
  <!-- Header -->
  <div style="padding:11px 14px;border-bottom:1px solid ${C().border};display:flex;align-items:center;gap:10px;flex-shrink:0">
    <button onclick="closePanel(${isPro})" style="display:flex;align-items:center;gap:4px;background:${C().bg3};border:1px solid ${C().border};border-radius:6px;color:${C().text2};cursor:pointer;font-size:11px;font-weight:600;padding:4px 10px;font-family:inherit">${isRtl?'→':'←'} ${t('back')||'Back'}</button>
    <div style="flex:1;min-width:0">
      <div style="font-size:13px;font-weight:700;color:${tier.color}">${getToolLabel(tool)}</div>
      <div style="font-size:10px;color:${C().text4};margin-top:1px">${t('configParams')||'Configure parameters'}</div>
    </div>
    ${tool.free?freeBadge(isPro):''}
  </div>

  <!-- Demo Data Notice -->
  <div style="margin:10px 14px 0;padding:7px 10px;background:${C().bg2};border-radius:6px;border:1px solid ${C().border};display:flex;align-items:center;gap:6px">
    <span style="font-size:11px">📊</span>
    <div>
      <div style="font-size:10px;font-weight:600;color:${C().text3}">${t('demoData')||'Demo Data'}</div>
      <div style="font-size:10px;color:${C().text4}">1,247 ${t('rows')||'rows'} × 10 columns</div>
    </div>
    <div style="margin-left:auto;display:flex;flex-wrap:wrap;gap:2px;max-width:120px">
      ${DEMO_COLS.slice(0,5).map(c=>`<span style="font-size:8px;padding:1px 4px;background:${C().bg3};border-radius:2px;color:${C().text4}">${c}</span>`).join('')}
    </div>
  </div>

  <!-- Params -->
  <div style="flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px">
    ${params.length===0?`<div style="color:${C().text4};font-size:12px;text-align:center;padding:20px">${t('noParams')||'No configuration needed'}</div>`:
    params.map(p=>`
      <div>
        <label style="font-size:10px;color:${C().text3};display:block;margin-bottom:4px;font-weight:600;letter-spacing:.03em">
          ${isRTL()?p.labelFa:p.label}${p.required?`<span style="color:${tier.color};margin-left:3px">*</span>`:''}
        </label>
        ${p.type==='column'?`
          <select id="sel_${p.key}" onchange="handleColSelect('${p.key}',this.value,${isPro})"
            style="width:100%;background:${C().bg2};border:1px solid ${paramValues[p.key]&&paramValues[p.key]!=='__custom__'?C().border2:(p.required?'#F8711833':C().border)};border-radius:5px;color:${paramValues[p.key]?C().text2:C().text4};font-size:12px;padding:7px 10px;cursor:pointer;font-family:inherit;margin-bottom:4px">
            <option value="">${t('selectCol')||'— Select column —'}</option>
            ${DEMO_COLS.map(c=>`<option value="${c}"${paramValues[p.key]===c?' selected':''}>${c}</option>`).join('')}
            <option value="__custom__" ${paramValues[p.key]==='__custom__'||(!DEMO_COLS.includes(paramValues[p.key])&&paramValues[p.key])?'selected':''}>✏ ${t('customCol')||'Enter column name...'}</option>
          </select>
          ${(paramValues[p.key]==='__custom__'||(!DEMO_COLS.includes(paramValues[p.key])&&paramValues[p.key]))?`
          <input type="text" 
            value="${(!DEMO_COLS.includes(paramValues[p.key])&&paramValues[p.key]&&paramValues[p.key]!=='__custom__')?paramValues[p.key]:''}"
            oninput="setParam('${p.key}',this.value||'__custom__');if(this.value)setParam('${p.key}',this.value)"
            placeholder="${t('customColPh')||'e.g. SalesAmount, OrderDate...'}"
            style="width:100%;background:${C().bg2};border:1px solid ${C().accent}66;border-radius:5px;color:${C().text2};font-size:12px;padding:7px 10px;font-family:inherit"/>
          `:''}
        `:
        p.type==='select'?`
          <select onchange="setParam('${p.key}',this.value)" style="width:100%;background:${C().bg2};border:1px solid ${C().border2};border-radius:5px;color:${C().text2};font-size:12px;padding:7px 10px;cursor:pointer;font-family:inherit">
            ${(p.options||[]).map(opt=>`<option value="${opt}"${(paramValues[p.key]??p.default)===opt?' selected':''}>${opt}</option>`).join('')}
          </select>`:
        p.type==='number'?`
          <input type="number" value="${paramValues[p.key]??p.default??''}" onchange="setParam('${p.key}',this.value)" step="any"
            style="width:100%;background:${C().bg2};border:1px solid ${C().border2};border-radius:5px;color:${C().text2};font-size:12px;padding:7px 10px;font-family:inherit"/>`:
        `<input type="text" value="${paramValues[p.key]??''}" oninput="setParam('${p.key}',this.value)" placeholder="${p.default||''}"
            style="width:100%;background:${C().bg2};border:1px solid ${C().border2};border-radius:5px;color:${C().text2};font-size:12px;padding:7px 10px;font-family:inherit"/>`}
      </div>`).join('')}
    ${params.some(p=>p.type==='column')?`
    <div style="padding:8px 10px;background:${C().bg2};border-radius:6px;border:1px solid ${C().border}">
      <div style="font-size:10px;color:${C().text4};margin-bottom:4px">${t('availCols')||'Available columns:'}</div>
      <div style="display:flex;flex-wrap:wrap;gap:3px">
        ${DEMO_COLS.map(c=>`<span style="font-size:10px;padding:1px 5px;background:${C().bg3};border-radius:3px;color:${C().text3};cursor:pointer" onclick="document.querySelector('select[onchange*=\\"${params.find(p=>p.type==='column')?.key}\\"]').value='${c}';setParam('${params.find(p=>p.type==='column')?.key}','${c}');rf(${isPro})">${c}</span>`).join('')}
      </div>
    </div>`:''}
  </div>

  <!-- Run -->
  <div style="padding:12px 14px;border-top:1px solid ${C().border};flex-shrink:0">
    <button onclick="runTool('${tierId}','${toolId}',${isPro})"
      style="width:100%;padding:10px;background:${canRun?`linear-gradient(135deg,${tier.color},${tier.color}99)`:`${C().bg3}`};border:none;border-radius:7px;color:${canRun?'#0D1117':C().text4};font-weight:800;font-size:12px;cursor:${canRun?'pointer':'not-allowed'};font-family:inherit;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:7px">
      <span style="font-size:13px">▶</span> ${t('runTool')}
    </button>
    ${!canRun&&params.some(p=>p.required)?`<div style="font-size:10px;color:${C().text4};text-align:center;margin-top:5px">${t('reqCols')||'* Select required columns'}</div>`:''}
  </div>
  </div>`;
}

function renderSearchResults(results,isPro){
  if(!results.length)return`<div style="padding:32px 16px;text-align:center;color:${C().text4}">

  return`<div>

      const canUse=tool.free||isPro,isSel=i===selectedIdx;
      const displayLabel=getToolLabel(tool);
      return`<div class="sr${isSel?' sel':''}" onclick="clickTool('${tier.id}','${tool.id}',${isPro})" onmouseenter="selectedIdx=${i}"

          <div style="font-size:10px;color:${C().text4};margin-top:1px">${tier.label}</div>
        </div>
        ${tool.free?freeBadge(isPro):canUse?`<span style="font-size:10px;color:${tier.color}">▶</span>`:`<span style="font-size:10px;color:${C().border2}">⬡</span>`}

function renderTiers(isPro){

    const freeCount=tier.tools.filter(t=>t.free).length;
    return`<div>
      <div class="tr" onclick="toggleTier('${tier.id}',${isPro})" style="display:flex;align-items:center;gap:8px;padding:9px 14px;cursor:pointer;border-left:2px solid ${isActive?tier.color:'transparent'};background:${isActive?C().bg2:'transparent'};transition:all .12s;user-select:none">

        <span style="font-size:12px;font-weight:${isActive?600:400};color:${isActive?C().text:C().text3};flex:1">${t('tier_'+tier.id)||tier.label}</span>
        <span style="font-size:11px;color:${C().text4}">${toLocalDigits(tier.tools.length)} ${t('tools')||'tools'}</span>
        ${!isPro&&freeCount>0?`<span style="font-size:11px;color:${C().accent};font-weight:600">${toLocalDigits(freeCount)} ${t('free')||'free'}</span>`:''}
        <span style="font-size:10px;color:${C().text4}">${isActive?'▴':'▾'}</span>
      </div>
      ${isActive?`<div style="background:${C().bg3};border-bottom:1px solid ${C().border}">
        ${tier.tools.map(tool=>{
          const canUse=tool.free||isPro;
          return`<div class="tr" onclick="clickTool('${tier.id}','${tool.id}',${isPro})" style="display:flex;align-items:center;gap:8px;padding:7px 14px 7px 32px;cursor:pointer;transition:background .1s">

        }).join('')}
      </div>`:''}
    </div>`;
  }).join('');

          style="padding:10px 14px;border-bottom:1px solid ${C().border}22;cursor:pointer;display:flex;gap:9px;align-items:flex-start;background:${!msg.read?(isDark?'#0D1B2D':'#EEF6FF'):'transparent'}">

    </div>
    <div style="padding:6px 14px 8px;border-top:1px solid ${C().border};flex-shrink:0;text-align:center">
      <span style="font-size:10px;color:${C().text4}">${toLocalDigits(INBOX_MESSAGES.length)} ${INBOX_MESSAGES.length!==1?(t('inboxMessagesP')||'messages'):(t('inboxMessages')||'message')} · Swak</span>
    </div>
  </div>
  <div style="position:fixed;inset:0;z-index:9998" onclick="showInbox=false;rf(currentScreen==='app-pro')"></div>`;
}


function rf(isPro){
  const f=document.getElementById('frame');
  if(!f)return;
  const s=currentScreen;
  let html='';
  if(appStarting) html=renderStartup();
  else if(s==='onboarding') html=renderOnboarding();
  else if(s==='keyinput') html=renderKeyInput();
  else html=renderApp(isPro||currentScreen==='app-pro');
  // Overlay modals + global theme/lang bar on top
  html += renderUpdateModal() + renderWhatsNew() + renderOfflineWall() + renderDeviceConflict() + renderPostUpdateChangelog();
  f.innerHTML=html;

  f.style.background=C().bg;
  f.style.position='relative'; // for inbox dropdown
  // Apply Farsi font when lang=fa
  if(lang==='fa'||lang==='ar'){
    f.style.fontFamily="'BKoodak','Vazirmatn','Tahoma','Arial',sans-serif";
    f.style.direction='rtl';
  } else {
    f.style.fontFamily="'Inter','Segoe UI',system-ui,sans-serif";
    f.style.direction='ltr';
  }
  f.className='frame'+(isDark?'':' light-frame');
}

  if(e.key==='ArrowDown'){e.preventDefault();selectedIdx=Math.min(selectedIdx+1,results.length-1);rf(isPro);}
  else if(e.key==='ArrowUp'){e.preventDefault();selectedIdx=Math.max(selectedIdx-1,0);rf(isPro);}

async function simulateActivation(){
  const v=(document.getElementById('keyIn')?.value||'').trim();
  if(!window._keyValid){showT('error',t('toastInvalidKey'));return;}

  // Check internet before attempting
  if(!navigator.onLine) {
    showErrorModal({
      icon:'📡',
      title: t('offlineTitle')||'No Internet Connection',
      message: t('offlineDesc')||'Please check your internet connection and try again.',
      btnText: t('retryConnection')||'Retry',
      btnAction: 'simulateActivation()',
      color:'#6B7280'
    });
    return;
  }

  window._keyState='validating';
  rf(false);

  try {
    const resp = await validateLicenseFromServer(v);

    if(resp.errorCode === 'INVALID_DEVICE') {
      showDeviceTamperingModal();
      window._keyState='idle';
      rf(false);
      return;
    }

    if(resp.errorCode === 'NETWORK_ERROR') {
      window._keyState='error';
      window._keyError = t('networkError')||'Network error. Please check your connection.';
      rf(false);
      return;
    }

    if(resp.valid) {
      applyServerLicense(resp, v);
      saveKeyToStorage(v);
      window._keyState='success';
      window._keyError='';
      rf(false);
    } else {
      window._keyState='error';
      window._keyError = t('keyError_'+resp.errorCode) || t('keyErrorInvalid') || 'Invalid license key.';
      // Show specific error modal for serious errors
      if(['LICENSE_REVOKED','LICENSE_SUSPENDED','RATE_LIMITED','DEVICE_CONFLICT'].includes(resp.errorCode)) {
        setTimeout(()=>showLicenseErrorModal(resp.errorCode), 400);
      }
      rf(false);
    }
  } catch(e) {
    window._keyState='error';
    window._keyError = t('serverError')||'An error occurred. Please try again.';
    rf(false);
  }
}

async function runTool(tierId, toolId, isPro){
  const actuallyPro = isPlanPro();
  const tier = TIERS.find(tr=>tr.id===tierId);
  const tool = tier?.tools.find(tr=>tr.id===toolId);

  // Free tool lock: re-disable immediately if user bypassed UI
  if(tool && !tool.free && !actuallyPro) {
    showT('error', t('upgradeRequired')||'Upgrade to Pro to use this tool.');
    // Re-disable the button (undo any bypass)
    rf(false);
    return;
  }

  if(!canRunTool(toolId)) return;
  const toolColor = tier?.color||'#4ADE80';

  // ── Pro tools: verify license with server before EVERY run ──
  if(actuallyPro) {
    const savedKey = licenseState.licenseKey || (() => { try { return localStorage.getItem('swak_license_key'); } catch(e){ return null; } })();

    // Show Processing animation (non-blocking)
    _showRunStep(toolColor, '🔐', t('processing')||'Processing...', null);

    const authOk = await verifyLicenseBeforeRun(savedKey);
    if(!authOk) return; // modal already shown by verifyLicenseBeforeRun
  }

  // STEP 2: Reading data
  await new Promise(r=>setTimeout(r,300));
  _showRunStep(toolColor, '📊', t('readingData')||'Reading Excel data...', '1,247 '+t('rows'));

  // STEP 3: Processing
  await new Promise(r=>setTimeout(r,400));
  _showRunStep(toolColor, '⚙', t('processingData')||'Processing...', toolId.replace(/-/g,' '));

  // STEP 4: Writing
  await new Promise(r=>setTimeout(r,300));
  _showRunStep(toolColor, '✓', t('writingResult')||'Writing to Excel...', null);

  await new Promise(r=>setTimeout(r,300));
  showResult=true;
  rf(isPro);
}

// ─── Internet reachability check (non-blocking) ───
async function checkInternetReachable() {
  // navigator.onLine is the most reliable signal available in add-in context
  // no-cors fetch is unreliable (always "opaque" response, can't distinguish success/fail)
  // So we trust navigator.onLine + let the actual Supabase RPC confirm connectivity
  return navigator.onLine !== false;
}

async function startupFlow() {
  // Freeze config
  try {
    Object.defineProperty(window, 'APP_NAME', {value: APP_NAME, writable: false, configurable: false});
    Object.defineProperty(window, 'APP_VERSION', {value: APP_VERSION, writable: false, configurable: false});
  } catch(e) {}

  // Remove leftover modals
  ['swak-timeout-modal','swak-error-modal','swak-offline-wall'].forEach(id => {
    document.getElementById(id)?.remove();
  });

  appStarting = true;
  startupStatus = 'connecting';
  rf(false);  // show loading screen immediately

  // Tiny delay so browser renders the loading screen
  await new Promise(r => setTimeout(r, 150));

  // ── STEP 1: Check internet ──
  const hasInternet = await checkInternetReachable();
  if(!hasInternet) {
    // Show offline modal and STOP — no server call
    updateConnectionStatus(false);
    appStarting = false;
    rf(false);
    // Show offline modal (locked)
    const frame = document.getElementById('frame');
    if(frame && !document.getElementById('swak-offline-wall')) {
      const wall = document.createElement('div');
      wall.id = 'swak-offline-wall';
      wall.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.9);backdrop-filter:blur(8px);z-index:2147483645;display:flex;align-items:center;justify-content:center;padding:16px';
      wall.onclick = e => e.stopPropagation();
      const bg = isDark?'#161B22':'#fff', tc = isDark?'#e6edf3':'#1a1a2e', sc = isDark?'#8b949e':'#666', bc = isDark?'#30363d':'#e1e4e8';
      wall.innerHTML = `
        <div style="background:${bg};border:1px solid ${bc};border-radius:16px;padding:28px 24px;width:100%;max-width:280px;text-align:center;box-shadow:0 24px 64px rgba(0,0,0,.5)">
          <div style="font-size:38px;margin-bottom:12px">📡</div>
          <div style="font-size:14px;font-weight:800;color:${tc};margin-bottom:8px">${t('offlineTitle')||'No Internet Connection'}</div>
          <div style="font-size:11px;color:${sc};line-height:1.6;margin-bottom:20px">${t('offlineDesc')||'Swak requires internet to verify your license.'}</div>
          <button onclick="document.getElementById('swak-offline-wall')?.remove();startupFlow()"
            style="width:100%;padding:10px;background:linear-gradient(135deg,#4ADE80,#22C55E);border:none;border-radius:8px;color:#0D1117;font-weight:800;font-size:12px;cursor:pointer;font-family:inherit;margin-bottom:8px">
            🔄 ${t('retryConnection')||'Retry'}
          </button>
        </div>`;
      frame.appendChild(wall);
    }
    return;
  }

  // Internet OK — update status
  updateConnectionStatus(true);

  // ── STEP 2: Check for saved license ──
  let savedKey = null;
  try { savedKey = localStorage.getItem('swak_license_key'); } catch(e){}

  if(!savedKey) {
    // No license key — first time user → onboarding, no server call
    startupStatus = 'ready';
    await new Promise(r => setTimeout(r, 350));
    appStarting = false;
    show('onboarding');
    const el = document.getElementById('opsCount');
    if(el) el.textContent = totalOps();
    return;
  }

  // ── STEP 3: Real server call with 20s timeout ──
  startupStatus = 'checking';
  rf(false);

  let serverTimedOut = false;
  const overallTimer = setTimeout(() => {
    serverTimedOut = true;
    appStarting = false;
    rf(false);
    handleAuthResult(null, savedKey, null);
  }, 20000);

  try {
    const resp = await validateLicenseFromServer(savedKey);
    if(serverTimedOut) return;
    clearTimeout(overallTimer);
    appStarting = false;

    // Case 1: No saved key → onboarding (already handled above)
    // Cases 2-5: handleAuthResult shows modal and locks
    // Case 6: success → enter app
    handleAuthResult(resp, savedKey, () => {
      startupStatus = 'ready';
      rf(false);
      if(isPlanPro()) {
        show('app-pro');
        startLicensePolling(savedKey);
        const lastSeen = (() => { try { return localStorage.getItem('swak_last_version'); } catch(e){ return null; } })();
        if(lastSeen !== APP_VERSION) {
          showWhatsNew = true;
          try { localStorage.setItem('swak_last_version', APP_VERSION); } catch(e){}
        }
      } else {
        show('app');
      }
    });
  } catch(e) {
    if(serverTimedOut) return;
    clearTimeout(overallTimer);
    appStarting = false;
    // Network error during RPC
    handleAuthResult(null, savedKey, null);
  }

  const el = document.getElementById('opsCount');
  if(el) el.textContent = totalOps();
}

    if(f && wall){
      wall.style.display='flex';
      wall.style.zIndex='2147483647';
    }
  };
  // Watch for DOM changes
  new MutationObserver(guard).observe(document.body,{childList:true,subtree:true,attributes:true});
  // Also intercept clicks on document level
  document.addEventListener('click', e=>{
    if(showUpdateModal){
      const wall=document.getElementById('swak-update-wall');
      if(!wall || !wall.contains(e.target)){
        e.stopImmediatePropagation();
        e.preventDefault();
        // Re-show wall
        rf(currentScreen==='app-pro');
      }
    }
  }, true);
}
</script>
