// ── DEVICE FINGERPRINT (stable, never stored) ──
// Computed live on every call - cannot be spoofed from localStorage
function getDeviceFingerprint() {
  try {
    const nav = window.navigator;
    const screen = window.screen;
    
    // Collect stable hardware signals
    const components = [
      nav.userAgent,
      nav.language,
      nav.platform,
      nav.hardwareConcurrency || '',
      nav.maxTouchPoints || '',
      screen.width + 'x' + screen.height,
      screen.colorDepth,
      screen.pixelDepth,
      Intl.DateTimeFormat().resolvedOptions().timeZone || '',
      nav.languages ? nav.languages.join(',') : '',
    ];

    // Try to get Office-specific stable identifiers
    if(typeof Office !== 'undefined' && Office.context) {
      try {
        const host = Office.context.host || '';
        const platform = Office.context.platform || '';
        components.push(host, platform);
      } catch(e){}
    }

    // Hash with FNV-1a for a stable 64-bit fingerprint
    const raw = components.join('|||');
    let h1 = 0x811c9dc5, h2 = 0x811c9dc5;
    for(let i = 0; i < raw.length; i++) {
      const ch = raw.charCodeAt(i);
      h1 ^= ch; h1 = Math.imul(h1, 0x01000193);
      h2 ^= ch; h2 = Math.imul(h2, 0x01000193) ^ (i * 31);
    }
    // Return as 64-char hex string (min length 32 for server validation)
    const fp = (h1 >>> 0).toString(16).padStart(8,'0') +
               (h2 >>> 0).toString(16).padStart(8,'0') +
               btoa(raw.slice(0,48)).replace(/[^a-zA-Z0-9]/g,'').slice(0,48);
    return fp;
  } catch(e) {
    // Fallback: use navigator.userAgent hash only
    const raw = navigator.userAgent + navigator.language + screen.width;
    let h = 0;
    for(let i = 0; i < raw.length; i++) h = Math.imul(h ^ raw.charCodeAt(i), 0x01000193);
    return (h >>> 0).toString(16).padStart(8,'0').repeat(8).slice(0,64);
  }
}

let licenseState = {

// ── SUPABASE RPC CALL (Office-compatible, no AbortSignal) ──
async function callSupabaseRPC(fnName, params = {}, timeoutMs = 8000) {
  const url = `${SUPABASE_URL}/rest/v1/rpc/${fnName}`;

  // Office srcdoc cannot clone AbortSignal or Headers via postMessage
  // So we race a plain fetch (no signal) against a timeout promise
  const fetchPromise = fetch(url, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
    },
    body: JSON.stringify(params),
    // NO signal — AbortSignal cannot be cloned in Office iframe
  });

  const timeoutPromise = new Promise((_, reject) =>
    setTimeout(() => reject(new Error('TIMEOUT')), timeoutMs)
  );

  try {
    const resp = await Promise.race([fetchPromise, timeoutPromise]);
    if(!resp.ok) {
      if(resp.status === 401 || resp.status === 403) throw new Error('INVALID_ANON_KEY');
      if(resp.status === 404) throw new Error('SERVER_ERROR');
      if(resp.status === 500) throw new Error('SERVER_ERROR_500');
      throw new Error('SERVER_ERROR_' + resp.status);
    }
    const data = await resp.json();
    return data;
  } catch(e) {
    if(e.message === 'TIMEOUT') throw e;
    if(e.message === 'INVALID_ANON_KEY') throw e;
    if(e.message && e.message.startsWith('SERVER_ERROR')) throw e;
    throw new Error('NETWORK_ERROR');
  }
}


// ── VALIDATE LICENSE FROM SUPABASE ──
async function validateLicenseFromServer(key) {
  // Get live device fingerprint (never cached)
  const deviceId = getDeviceFingerprint();
  
  // Anti-spoofing check before sending
  if(!deviceId || deviceId.length < 32) {
    return { valid: false, error: 'INVALID_DEVICE', errorCode: 'INVALID_DEVICE' };
  }

  try {
    const result = await callSupabaseRPC('validate_license', {
      p_key: key,
      p_device_id: deviceId,
    });
    return {
      valid: result.valid || false,
      plan: result.plan || 'free',
      expiresAt: result.expires_at || null,
      daysRemaining: result.days_remaining || 0,
      userCount: result.seat_count || 1,
      error: result.error || null,
      errorCode: result.error_code || null,
      firstActivation: result.first_activation || false,
    };
  } catch(e) {
    const code = e.message || 'NETWORK_ERROR';
    if(code === 'TIMEOUT') return { valid: false, error: 'TIMEOUT', errorCode: 'TIMEOUT' };
    if(code === 'INVALID_ANON_KEY') return { valid: false, error: 'INVALID_ANON_KEY', errorCode: 'INVALID_ANON_KEY' };
    if(code.startsWith('SERVER_ERROR')) return { valid: false, error: 'SERVER_ERROR', errorCode: 'SERVER_ERROR' };
    return { valid: false, error: 'NETWORK_ERROR', errorCode: 'NETWORK_ERROR' };
  }
}

// SECURITY: Freeze licenseState after setting (prevents console override)
function applyServerLicense(serverResp, key) {
  // Stamp validation time + generate integrity token
  serverResp.lastValidated = Date.now();
  const tok = btoa((serverResp.plan||'free') + (key||'') + 'swak_v1_integrity').slice(0,16);
  serverResp._tok = tok;
  // Only this function can update licenseState
  if(serverResp.errorCode === 'INVALID_DEVICE') {
    showDeviceTamperingModal();
    return;
  }
  if(serverResp.valid) {
    licenseState = {
      valid: true,
      plan: serverResp.plan,
      expiresAt: serverResp.expiresAt,
      daysRemaining: serverResp.daysRemaining,
      userCount: serverResp.userCount,
      licenseKey: key,
      deviceId: getDeviceFingerprint(),
      lastValidated: Date.now(),
    };
    // Refresh lastValidated every 5 min to keep isPlanPro() returning true
    // (in production this is done by scheduleRevalidation)
    // Check if expired
    if(licenseState.daysRemaining <= 0) {
      licenseState.valid = false;
      licenseState.plan = 'free';
    }
  } else {
    licenseState = { valid: false, plan: 'free', expiresAt: null, daysRemaining: null, 
                     userCount: null, licenseKey: null, deviceId: null, lastValidated: null };
  }
  // Prevent console tampering: freeze the state object
  // Note: Object.freeze only prevents property modification, not reassignment of licenseState var
  // The real protection is that all UI reads go through isPlanPro() which checks daysRemaining
  Object.freeze(licenseState);
}

function isPlanPro() {
  // Server-authoritative check - multiple conditions must ALL pass
  if(!licenseState) return false;
  if(!licenseState.valid) return false;
  if(licenseState.plan === 'free' || !licenseState.plan) return false;
  if(licenseState.daysRemaining === null || licenseState.daysRemaining <= 0) return false;
  if(!licenseState.lastValidated) return false;
  // Prevent replay attacks: state must have been validated recently (within 6 min grace)
  const staleness = Date.now() - licenseState.lastValidated;
  if(staleness > 6 * 60 * 1000) return false;
  // Integrity token check: detects console tampering of licenseState
  if(licenseState._tok) {
    const expected = btoa((licenseState.plan||'') + (licenseState.licenseKey||'') + 'swak_v1_integrity').slice(0,16);
    if(licenseState._tok !== expected) {
      licenseState = { valid: false, plan: 'free', _tok: null };
      return false;
    }
  } else if(typeof Office !== 'undefined') {
    // In real add-in: no token = not validated by server = deny
    return false;
  }
  return true;
}

// Lock entire app - prevents all interaction
function lockApp(modalId) {
  // Already locked
  if(document.getElementById(modalId)) return;
  // Prevent clicks on frame
  const frame = document.getElementById('frame');
  if(frame) frame.style.pointerEvents = 'none';
}

function unlockApp() {
  const frame = document.getElementById('frame');
  if(frame) frame.style.pointerEvents = '';
}

// Show a beautiful locked modal
function showLockedModal({id, icon, title, message, color='#F59E0B',
  btn1Text, btn1Action, btn2Text, btn2Action}) {
  // Remove existing
  document.getElementById(id)?.remove();
  const frame = document.getElementById('frame');
  if(!frame) return;

  lockApp(id);
  const overlay = document.createElement('div');
  overlay.id = id;
  overlay.style.cssText = `position:fixed;inset:0;background:rgba(0,0,0,0.92);
    backdrop-filter:blur(10px);z-index:2147483647;display:flex;align-items:center;
    justify-content:center;padding:16px`;
  overlay.onclick = e => e.stopPropagation();
  overlay.onkeydown = e => e.stopPropagation();

  const bg = isDark?'#161B22':LIGHT.bg2;
  const tc = isDark?'#e6edf3':LIGHT.text;
  const sc = isDark?'#8b949e':LIGHT.text3;
  const bc = isDark?'#30363d':LIGHT.border;

  const b1 = btn1Text ? `<button onclick="unlockApp();document.getElementById('${id}')?.remove();${btn1Action||''}"
    style="width:100%;padding:10px;background:linear-gradient(135deg,${color},${color}bb);border:none;
    border-radius:8px;color:#fff;font-weight:800;font-size:12px;cursor:pointer;font-family:inherit;margin-bottom:8px">
    ${btn1Text}</button>` : '';

  const b2 = btn2Text ? `<button onclick="window.open('https://swaksoft.com/contact','_blank')"
    style="width:100%;padding:9px;background:none;border:1px solid ${bc};border-radius:8px;
    color:${sc};font-size:11px;cursor:pointer;font-family:inherit">
    ${btn2Text}</button>` : '';

  overlay.innerHTML = `
    <div style="background:${bg};border:1px solid ${bc};border-radius:18px;
      padding:30px 24px;width:100%;max-width:282px;text-align:center;
      box-shadow:0 32px 80px rgba(0,0,0,.6)">
      <div style="font-size:44px;margin-bottom:14px">${icon}</div>
      <div style="font-size:14px;font-weight:800;color:${tc};margin-bottom:8px;line-height:1.3">${title}</div>
      <div style="font-size:11px;color:${sc};line-height:1.7;margin-bottom:22px">${message}</div>
      ${b1}${b2}
    </div>`;
  frame.appendChild(overlay);
}

// ── AUTH RESULT HANDLER ──
// Handles all 6 cases from startup/periodic/tool check
function handleAuthResult(resp, savedKey, afterSuccess) {
  if(!resp) {
    // Server timeout/no response
    updateConnectionStatus(false);
    showLockedModal({
      id: 'swak-server-timeout',
      icon: '⏱️',
      title: t('timeoutTitle')||'Server Not Responding',
      message: t('timeoutMsg')||'Swak servers are not responding. Please check your connection and try again.',
      color: '#6B7280',
      btn1Text: '🔄 '+(t('retryConnection')||'Try Again'),
      btn1Action: 'startupFlow()',
      btn2Text: '💬 '+(t('contactSupport')||'Contact Support'),
    });
    return;
  }

  const code = resp.errorCode || resp.error_code || null;

  // Case 5: Device fingerprint invalid/tampered
  if(code === 'INVALID_DEVICE') {
    updateConnectionStatus(false);
    showLockedModal({
      id: 'swak-device-error',
      icon: '🔐',
      title: t('deviceTamperTitle')||'Device ID Not Recognized',
      message: t('deviceTamperMsg')||'Your device hardware ID could not be identified or has been tampered with. The add-in is locked for security.',
      color: '#EF4444',
      btn1Text: '💬 '+(t('contactSupport')||'Contact Support'),
      btn1Action: "window.open('https://swaksoft.com/contact','_blank')",
    });
    return;
  }

  // Case 2: License not found in DB
  if(code === 'NOT_FOUND' || code === 'INVALID_KEY') {
    updateConnectionStatus(true);
    try { localStorage.removeItem('swak_license_key'); } catch(e){}
    showLockedModal({
      id: 'swak-invalid-license',
      icon: '🔑',
      title: t('keyErrorTitle')||'Invalid License',
      message: t('keyErrorMsg')||'The license stored on this device was not found. Please re-enter your license key.',
      color: '#F59E0B',
      btn1Text: t('enterLicense')||'Enter License Key',
      btn1Action: "show('keyinput')",
    });
    return;
  }

  // Case 3: License expired
  if(code === 'LICENSE_EXPIRED' || resp.errorCode === 'LICENSE_EXPIRED') {
    updateConnectionStatus(true);
    showLockedModal({
      id: 'swak-expired',
      icon: '⏰',
      title: t('expiredTitle')||'License Expired',
      message: t('expiredMsg')||'Your license has expired. Purchase a new license to continue using Swak Pro.',
      color: '#F59E0B',
      btn1Text: '🛒 '+(t('buyLicense')||'Buy New License'),
      btn1Action: "show('onboarding')",
      btn2Text: '💬 '+(t('contactSupport')||'Contact Support'),
    });
    return;
  }

  // Case 4: License active on another device
  if(code === 'DEVICE_CONFLICT') {
    updateConnectionStatus(true);
    try { localStorage.removeItem('swak_license_key'); } catch(e){}
    showLockedModal({
      id: 'swak-device-conflict',
      icon: '💻',
      title: t('deviceConflict')||'License On Another Device',
      message: t('deviceConflictMsg')||'This license is already activated on another computer. Please use your original device or contact support.',
      color: '#F59E0B',
      btn1Text: t('backToOnboarding')||'OK',
      btn1Action: "show('onboarding')",
      btn2Text: '💬 '+(t('contactSupport')||'Contact Support'),
    });
    return;
  }

  // License suspended or revoked
  if(code === 'LICENSE_SUSPENDED' || code === 'LICENSE_REVOKED') {
    updateConnectionStatus(true);
    showLockedModal({
      id: 'swak-license-blocked',
      icon: '🚫',
      title: code === 'LICENSE_SUSPENDED' ? (t('suspendedTitle')||'License Suspended') : (t('revokedTitle')||'License Revoked'),
      message: code === 'LICENSE_SUSPENDED' ? (t('suspendedMsg')||'Your license is temporarily suspended.') : (t('revokedMsg')||'Your license has been revoked.'),
      color: '#EF4444',
      btn1Text: '💬 '+(t('contactSupport')||'Contact Support'),
      btn1Action: "window.open('https://swaksoft.com/contact','_blank')",
    });
    return;
  }

  // Rate limited
  if(code === 'RATE_LIMITED') {
    updateConnectionStatus(true);
    showLockedModal({
      id: 'swak-rate-limited',
      icon: '🛡️',
      title: t('rateLimitTitle')||'Too Many Attempts',
      message: t('rateLimitMsg')||'Too many failed attempts. Please wait before trying again.',
      color: '#EF4444',
      btn1Text: t('contactSupport')||'Contact Support',
      btn1Action: "window.open('https://swaksoft.com/contact','_blank')",
    });
    return;
  }

  // Case 6: SUCCESS
  if(resp.valid) {
    updateConnectionStatus(true);
    applyServerLicense(resp, savedKey);
    if(typeof afterSuccess === 'function') afterSuccess();
    return;
  }

  // Unknown error
  updateConnectionStatus(false);
  showLockedModal({
    id: 'swak-server-error',
    icon: '⚠️',
    title: t('serverErrorTitle')||'Unexpected Error',
    message: t('serverErrorMsg')||'An unexpected error occurred. Please try again.',
    color: '#6B7280',
    btn1Text: '🔄 '+(t('retryConnection')||'Try Again'),
    btn1Action: 'startupFlow()',
    btn2Text: '💬 '+(t('contactSupport')||'Contact Support'),
  });
}

let _licenseCheckTimer = null;
function startLicensePolling(key) {
  if(_licenseCheckTimer) clearInterval(_licenseCheckTimer);
  _licenseCheckTimer = setInterval(async () => {
    if(!isPlanPro()) { stopLicensePolling(); return; }
    if(!navigator.onLine) { updateConnectionStatus(false); return; }
    try {
      const resp = await validateLicenseFromServer(key);
      if(!isPlanPro()) return; // user logged out during check
      handleAuthResult(resp, key, () => {
        // Still valid - update state silently
      });
    } catch(e) {
      updateConnectionStatus(false);
    }
  }, 5 * 60 * 1000); // 5 minutes
}

function stopLicensePolling() {
  if(_licenseCheckTimer) { clearInterval(_licenseCheckTimer); _licenseCheckTimer = null; }
}

// ── PER-TOOL AUTH CHECK ──
// Called before every Pro tool execution
async function verifyLicenseBeforeRun(savedKey) {
  if(!navigator.onLine) {
    updateConnectionStatus(false);
    showLockedModal({
      id: 'swak-offline-wall',
      icon: '📡',
      title: t('offlineTitle')||'No Internet Connection',
      message: t('offlineDesc')||'Swak requires internet to verify your license.',
      color: '#6B7280',
      btn1Text: '🔄 '+(t('retryConnection')||'Retry'),
      btn1Action: 'startupFlow()',
    });
    return false;
  }
  try {
    const resp = await validateLicenseFromServer(savedKey);
    if(resp && resp.valid) {
      applyServerLicense(resp, savedKey);
      return true;
    }
    handleAuthResult(resp, savedKey, null);
    return false;
  } catch(e) {
    handleAuthResult(null, savedKey, null);
    return false;
  }
}

// ── INTERNET STATUS (native events) ──
window.addEventListener('online', () => {
  updateConnectionStatus(true);
  if(!appStarting) {
    const wall = document.getElementById('swak-offline-wall');
    if(wall) wall.remove();
    rf(currentScreen==='app-pro');
  }
});
window.addEventListener('offline', () => {
  updateConnectionStatus(false);
  if(!appStarting) showOfflineModal();
});

function showOfflineModal() {
  if(document.getElementById('swak-offline-wall')) return;
  rf(currentScreen==='app-pro');
}

function updateConnectionStatus(connected) {
  isConnected = connected;
  // Update all status indicators without full re-render
  document.querySelectorAll('.conn-dot').forEach(el => {
    el.style.background = connected ? '#4ADE80' : '#F87171';
  });
  document.querySelectorAll('.conn-text').forEach(el => {
    el.textContent = connected ? t('connected') : t('disconnected');
  });
}

// Periodic license re-validation (every 30 min in production)
// Prevents client-side tampering with licenseState
function scheduleRevalidation() {
  if(!licenseState.licenseKey) return;
  setTimeout(async () => {
    try {
      const resp = await validateLicenseFromServer(licenseState.licenseKey);
      applyServerLicense(resp, licenseState.licenseKey);
      updateConnectionStatus(resp.valid !== undefined);
      // If license expired, downgrade to free
      if(!isPlanPro() && currentScreen === 'app-pro') {
        showT('error', t('licenseExpired')||'License expired. Switching to Free plan.');
        setTimeout(()=>show('app'), 2000);
      }
      scheduleRevalidation();
    } catch(e) {
      updateConnectionStatus(false);
      scheduleRevalidation();
    }
  }, 5 * 60 * 1000); // 5 minutes
}

// ── TOTAL OPS COUNT ──
function fmtCurrency(amount, suffix){
  const num = toLocalDigits(amount);
  const suf = suffix ? toLocalDigits(suffix) : '';
  return (lang==='fa'||lang==='ar') ? num+'$'+(suf?'/'+suf:'') : '$'+num+(suf?'/'+suf:'');
}
function fmtSeatNote(note){
  // Convert "$11.99/seat" to localized form with translated "seat" word
  if(!note) return '';
  const seatWord = t('seatLabel')||'seat';
  // Extract the price part before /seat
  const price = note.replace('/seat','').trim();
  const localPrice = (lang==='fa'||lang==='ar')
    ? toLocalDigits(price.replace('$',''))+'$'
    : price;
  return localPrice+'/'+seatWord;
}
function toLocalDigits(str){
  if(lang==='fa'){
    return String(str).replace(/[0-9]/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
  }
  if(lang==='ar'){
    return String(str).replace(/[0-9]/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
  }
  return String(str);
}

}

function getOptionLabel(value) {
  if (!value) return value;
  if (lang === 'en') return value;
  const map = OPTIONS_I18N[value];
  if (!map) return value;
  return map[lang] || value;
}

function getToolLabel(tool) {
  if (lang === 'en') return tool.label;
  if (lang === 'fa') return tool.labelFa || tool.label;
  const lmap = TOOL_LABELS[tool.id];
  return (lmap && lmap[lang]) ? lmap[lang] : tool.label;
}

function hl(text,q){
  if(!q)return text;
  const i=text.toLowerCase().indexOf(q.toLowerCase());
  if(i===-1)return text;
  return text.slice(0,i)+'<mark>'+text.slice(i,i+q.length)+'</mark>'+text.slice(i+q.length);
}
function getResults(q){
  if(!q.trim())return[];
  const ql=q.toLowerCase(),res=[];
  for(const tier of TIERS)
    for(const tool of tier.tools){
      const tlabel=getToolLabel(tool).toLowerCase();
      if(tool.label.toLowerCase().includes(ql)||tool.labelFa.toLowerCase().includes(ql)||tlabel.includes(ql)||tool.tags.some(tag=>tag.includes(ql)))
        res.push({tool,tier});
    }
  return res;
}

let paramValues = {};

function initParams(toolId) {
  const params = TOOL_PARAMS[toolId] || [];
  paramValues = {};
  params.forEach(p => {
    if(p.default !== undefined && p.default !== '') paramValues[p.key] = p.default;
  });
}

function handleColSelect(key, val, isPro) {
  if(val === '__custom__') {
    setParam(key, '__custom__');
  } else {
    setParam(key, val);
  }
  rf(isPro);
}

function setParam(key, val) {
  paramValues[key] = val;
}

function canRunTool(toolId) {
  const params = TOOL_PARAMS[toolId] || [];
  return params.filter(p => p.required).every(p => paramValues[p.key]);
}

async function retryConnection(){
  if(!navigator.onLine) {
    showErrorModal({
      icon:'📡',
      title: t('offlineTitle')||'No Internet Connection',
      message: t('offlineDesc')||'Swak requires internet to verify your license.',
      btnText: t('retryConnection')||'Retry',
      btnAction: 'retryConnection()',
      color:'#6B7280'
    });
    return;
  }
  document.getElementById('retry-spinner')?.style && (document.getElementById('retry-spinner').style.display='inline');
  try {
    if(licenseState.licenseKey){
      const resp = await validateLicenseFromServer(licenseState.licenseKey);
      applyServerLicense(resp, licenseState.licenseKey);
      updateConnectionStatus(true);
      rf(currentScreen==='app-pro');
    } else {
      // No key - just check server reachability
      await validateLicenseFromServer('SWAK-PING');
      updateConnectionStatus(true);
      rf(currentScreen==='app-pro');
    }
  } catch(e){
    updateConnectionStatus(false);
    showT('error', t('stillOffline')||'Still offline. Please check your internet connection.');
    rf(currentScreen==='app-pro');
  }
}

function renderToolPanel(tierId, toolId, isPro) {
  const isRtl=isRTL();
  const tier = TIERS.find(t=>t.id===tierId);
  const tool = tier?.tools.find(t=>t.id===toolId);
  if(!tool||!tier) return '';
  const params = TOOL_PARAMS[toolId] || [];
  const canRun = canRunTool(toolId);
  
  return`<div style="background:${C().bg};min-height:100%;display:flex;flex-direction:column;animation:slideRight .18s ease;direction:${isRTL()?'rtl':'ltr'}">
  <!-- Header -->
  <div style="padding:11px 14px;border-bottom:1px solid ${C().border};display:flex;align-items:center;gap:10px;flex-shrink:0">
    <button onclick="closePanel(${isPro})" style="display:flex;align-items:center;gap:4px;background:${C().bg3};border:1px solid ${C().border};border-radius:6px;color:${C().text2};cursor:pointer;font-size:11px;font-weight:600;padding:4px 10px;font-family:inherit">${isRtl?'→':'←'} ${t('back')||'Back'}</button>
    <div style="flex:1;min-width:0">
      <div style="font-size:13px;font-weight:700;color:${tier.color}">${getToolLabel(tool)}</div>
      <div style="font-size:10px;color:${C().text4};margin-top:1px">${t('configParams')||'Configure parameters'}</div>
    </div>
    
  </div>

  <!-- Params -->
  <div style="flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px">
    ${params.length===0?`<div style="color:${C().text4};font-size:12px;text-align:center;padding:20px">${t('noParams')||'No configuration needed'}</div>`:
    params.map(p=>`
      <div>
        <label style="font-size:10px;color:${C().text3};display:block;margin-bottom:4px;font-weight:600;letter-spacing:.03em">
          ${isRTL()?p.labelFa:p.label}${p.required?`<span style="color:${tier.color};margin-left:3px">*</span>`:''}
        </label>
        ${p.type==='column'?`
          <select id="sel_${p.key}" onchange="handleColSelect('${p.key}',this.value,${isPro})"
            style="width:100%;background:${C().bg2};border:1px solid ${paramValues[p.key]&&paramValues[p.key]!=='__custom__'?C().border2:(p.required?'#F8711833':C().border)};border-radius:5px;color:${paramValues[p.key]?C().text2:C().text4};font-size:12px;padding:7px 10px;cursor:pointer;font-family:inherit;margin-bottom:4px">
            <option value="">${t('selectCol')||'— Select column —'}</option>
            ${DEMO_COLS.map(c=>`<option value="${c}"${paramValues[p.key]===c?' selected':''}>${c}</option>`).join('')}
            <option value="__custom__" ${paramValues[p.key]==='__custom__'||(!DEMO_COLS.includes(paramValues[p.key])&&paramValues[p.key])?'selected':''}>✏ ${t('customCol')||'Enter column name...'}</option>
          </select>
          ${(paramValues[p.key]==='__custom__'||(!DEMO_COLS.includes(paramValues[p.key])&&paramValues[p.key]))?`
          <input type="text" 
            value="${(!DEMO_COLS.includes(paramValues[p.key])&&paramValues[p.key]&&paramValues[p.key]!=='__custom__')?paramValues[p.key]:''}"
            oninput="setParam('${p.key}',this.value||'__custom__');if(this.value)setParam('${p.key}',this.value)"
            placeholder="${t('customColPh')||'e.g. SalesAmount, OrderDate...'}"
            style="width:100%;background:${C().bg2};border:1px solid ${C().accent}66;border-radius:5px;color:${C().text2};font-size:12px;padding:7px 10px;font-family:inherit"/>
          `:''}
        `:
        p.type==='select'?`
          <select onchange="setParam('${p.key}',this.value)" style="width:100%;background:${C().bg2};border:1px solid ${C().border2};border-radius:5px;color:${C().text2};font-size:12px;padding:7px 10px;cursor:pointer;font-family:inherit">
            ${(p.options||[]).map(opt=>`<option value="${opt}"${(paramValues[p.key]??p.default)===opt?' selected':''}>${getOptionLabel(opt)}</option>`).join('')}
          </select>`:
        p.type==='number'?`
          <input type="number" value="${paramValues[p.key]??p.default??''}" onchange="setParam('${p.key}',this.value)" step="any"
            style="width:100%;background:${C().bg2};border:1px solid ${C().border2};border-radius:5px;color:${C().text2};font-size:12px;padding:7px 10px;font-family:inherit"/>`:
        `<input type="text" value="${paramValues[p.key]??''}" oninput="setParam('${p.key}',this.value)" placeholder="${p.default||''}"
            style="width:100%;background:${C().bg2};border:1px solid ${C().border2};border-radius:5px;color:${C().text2};font-size:12px;padding:7px 10px;font-family:inherit"/>`}
      </div>`).join('')}

// Build a preview table from backend result (headers + rows)
function _buildPreviewFromBackend(res) {
  if (!res) return null;
  // If backend returned a summary with stats only — no table preview
  if (!res.headers && !res.rows) return null;
  const hdrs = res.headers || [];
  const rows = (res.rows || []).slice(0, 8); // max 8 preview rows
  if (!hdrs.length) return null;
  const preview = [hdrs, ...rows.map(r=>
    hdrs.map((_,i) => {
      const v = r[i];
      if (v === null || v === undefined) return '—';
      if (typeof v === 'number') return Number.isInteger(v) ? v : parseFloat(v.toFixed(4));
      return String(v).substring(0, 40);
    })
  )];
  return preview;
}

// ── Inline modal focus trap ──────────────────────────────────────────────────
// Called after every rf() render. Finds any full-screen blocking overlay
// (offline wall, update wall, device-conflict, etc.) that was rendered as
// an HTML string into the frame, and applies a 4-layer focus trap on it.
let _inlineTrapCleanup = null;

function _applyInlineFocusTrap(frame) {
  // Clean up any previous trap
  if (_inlineTrapCleanup) { _inlineTrapCleanup(); _inlineTrapCleanup = null; }

  // Detect any fixed full-screen overlay rendered inside the frame
  const MODAL_IDS = ['swak-offline-wall','swak-update-wall','swak-device-conflict','swak-post-changelog'];
  let modal = null;
  for (const id of MODAL_IDS) {
    const el = document.getElementById(id);
    if (el) { modal = el; break; }
  }
  if (!modal) return; // no blocking modal — nothing to trap

  // Layer 1: inert on all frame children except the modal
  const inertTargets = Array.from(frame.children).filter(el => el !== modal);
  inertTargets.forEach(el => { el.setAttribute('inert',''); el.setAttribute('data-swak-itrap','1'); });

  // Layer 2: tabindex=-1 on all focusable elements outside modal
  const FOCUSABLE = 'button,input,select,textarea,a[href],[tabindex]:not([tabindex="-1"])';
  const outsideEls = Array.from(frame.querySelectorAll(FOCUSABLE)).filter(el => !modal.contains(el));
  outsideEls.forEach(el => {
    el._itrapPrevTabIndex = el.getAttribute('tabindex');
    el.setAttribute('tabindex','-1');
  });

  // Layer 3+4: document-level keydown + focusin guards
  const getFocusable = () => Array.from(modal.querySelectorAll('button:not([disabled]),input:not([disabled]),[tabindex]:not([tabindex="-1"])'));

  const keyHandler = (e) => {
    if (e.key !== 'Tab') return;
    const focusable = getFocusable();
    if (!focusable.length) { e.preventDefault(); return; }
    const first = focusable[0], last = focusable[focusable.length-1];
    const active = document.activeElement;
    if (e.shiftKey) {
      if (active === first || !modal.contains(active)) { e.preventDefault(); last.focus(); }
    } else {
      if (active === last || !modal.contains(active)) { e.preventDefault(); first.focus(); }
    }
  };

  const focusHandler = (e) => {
    if (!modal.isConnected) return;
    if (!modal.contains(e.target)) {
      e.stopPropagation();
      const focusable = getFocusable();
      if (focusable.length) focusable[0].focus();
    }
  };

  document.addEventListener('keydown', keyHandler, true);
  document.addEventListener('focusin', focusHandler, true);

  // Focus first button in modal
  requestAnimationFrame(() => {
    const firstBtn = modal.querySelector('button:not([disabled])');
    if (firstBtn) firstBtn.focus();
  });

  // Cleanup function — called on next render or when modal is removed
  _inlineTrapCleanup = () => {
    document.removeEventListener('keydown', keyHandler, true);
    document.removeEventListener('focusin', focusHandler, true);
    frame.querySelectorAll('[data-swak-itrap]').forEach(el => {
      el.removeAttribute('inert');
      el.removeAttribute('data-swak-itrap');
    });
    outsideEls.forEach(el => {
      if (el._itrapPrevTabIndex === null || el._itrapPrevTabIndex === undefined) {
        el.removeAttribute('tabindex');
      } else {
        el.setAttribute('tabindex', el._itrapPrevTabIndex);
      }
      delete el._itrapPrevTabIndex;
    });
  };
}

function rf(isPro){
  const f=document.getElementById('frame');
  if(!f)return;
  const s=currentScreen;
  let html='';
  if(appStarting) html=renderStartup();
  else if(s==='runtime-gate') html=renderRuntimeGate();
  else if(s==='onboarding') html=renderOnboarding();
  else if(s==='keyinput') html=renderKeyInput();
  else html=renderApp(isPro||currentScreen==='app-pro');
  // Overlay modals + global theme/lang bar on top
  html += renderUpdateModal() + renderWhatsNew() + renderOfflineWall() + renderDeviceConflict() + renderPostUpdateChangelog();
  f.innerHTML=`<div class="frame-inner">${html}</div>`;

  f.style.background=C().bg;
  document.body.style.background=C().bg; // sync body bg with theme
  f.style.position='relative'; // for inbox dropdown
  // Direction only — font is handled globally by @font-face unicode-range
  if(lang==='fa'||lang==='ar'){
    f.style.direction='rtl';
  } else {
    f.style.direction='ltr';
  }
  f.style.fontFamily=''; // let body font-family cascade — no override
  f.className='frame'+(isDark?'':' light-frame');

  // ── Post-render focus trap for inline modals (renderOfflineWall etc.) ──
  // These are HTML strings injected into f.innerHTML, so we trap them here
  // after DOM is ready, using the same 4-layer strategy as showErrorModal.
  _applyInlineFocusTrap(f);
}

// ══════════════════════════════════════════════════════════════
// ERROR MODAL SYSTEM
// ══════════════════════════════════════════════════════════════
function removeErrorModals() {
  ['swak-error-modal','swak-offline-wall'].forEach(id => {
    const modal = document.getElementById(id);
    if (!modal) return;

    // ── Restore inert (modern browsers) ──
    const frame = document.getElementById('frame');
    if (frame) frame.querySelectorAll('[data-swak-inert]').forEach(el => {
      el.removeAttribute('inert');
      el.removeAttribute('data-swak-inert');
    });

    // ── Restore tabindex / disabled (fallback for older browsers) ──
    if (modal._outsideEls) {
      modal._outsideEls.forEach(el => {
        // tabindex
        if (el._prevTabIndex === null || el._prevTabIndex === undefined) {
          el.removeAttribute('tabindex');
        } else {
          el.setAttribute('tabindex', el._prevTabIndex);
        }
        // disabled
        if ('disabled' in el) el.disabled = !!el._prevDisabled;
        delete el._prevTabIndex;
        delete el._prevDisabled;
      });
    }

    // ── Remove document-level focus/keydown guards ──
    if (modal._docKeyHandler)  document.removeEventListener('keydown', modal._docKeyHandler,  true);
    if (modal._docFocusHandler) document.removeEventListener('focusin', modal._docFocusHandler, true);

    modal.remove();
  });
  // Clear quota flag when modal is dismissed by user
  if (!document.getElementById('swak-error-modal')) {
    window._quotaModalOpen = false;
  }
}

function showErrorModal({icon='⚠️', title, message, btnText, btnAction, lockApp=false, color='#F59E0B'}) {
  removeErrorModals();
  const frame = document.getElementById('frame');
  if(!frame) return;

  const overlay = document.createElement('div');
  overlay.id = 'swak-error-modal';
  overlay.setAttribute('role', 'dialog');
  overlay.setAttribute('aria-modal', 'true');
  overlay.style.cssText = `position:fixed;inset:0;background:rgba(0,0,0,0.82);backdrop-filter:blur(6px);z-index:2147483640;display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeIn .25s ease`;

  const card = document.createElement('div');
  const bg = isDark ? '#161B22' : LIGHT.bg2;
  const textC = isDark ? '#e6edf3' : LIGHT.text;
  const subC = isDark ? '#8b949e' : LIGHT.text3;
  const borderC = isDark ? '#30363d' : LIGHT.border;
  card.style.cssText = `background:${bg};border:1px solid ${borderC};border-radius:16px;padding:28px 24px;width:100%;max-width:280px;text-align:center;box-shadow:0 24px 64px rgba(0,0,0,0.5)`;

  card.innerHTML = `
    <div style="font-size:40px;margin-bottom:12px">${icon}</div>
    <div style="font-size:14px;font-weight:800;color:${textC};margin-bottom:8px;line-height:1.3">${title}</div>
    <div style="font-size:11px;color:${subC};line-height:1.6;margin-bottom:20px">${message}</div>
    ${btnText ? `<button onclick="${btnAction||'removeErrorModals()'}" style="width:100%;padding:10px;background:linear-gradient(135deg,${color},${color}cc);border:none;border-radius:8px;color:#fff;font-weight:700;font-size:12px;cursor:pointer;font-family:inherit">${btnText}</button>` : ''}
    ${!lockApp && btnText ? `<button onclick="removeErrorModals()" style="width:100%;margin-top:8px;padding:8px;background:none;border:none;color:${subC};font-size:11px;cursor:pointer;font-family:inherit">Dismiss</button>` : ''}
  `;

  overlay.appendChild(card);
  if(lockApp) overlay.onclick = e => e.stopPropagation();
  else overlay.onclick = e => { if(e.target===overlay) removeErrorModals(); };
  frame.appendChild(overlay);

  // ── FOCUS TRAP — Layer 1: inert (modern browsers, handles everything natively) ──
  // Mark every direct child of frame that is NOT the modal as inert.
  // `inert` disables all interaction: keyboard, pointer, AT — no tabindex juggling needed.
  const inertTargets = Array.from(frame.children).filter(el => el !== overlay);
  inertTargets.forEach(el => {
    if (!el.hasAttribute('inert')) {
      el.setAttribute('inert', '');
      el.setAttribute('data-swak-inert', '1');
    }
  });

  // ── FOCUS TRAP — Layer 2: tabindex/-1 + disabled fallback (older browsers / Edge) ──
  // Targets all interactive elements in frame that are outside the modal.
  const FOCUSABLE = 'button,input,select,textarea,a[href],[tabindex]:not([tabindex="-1"])';
  const outsideEls = Array.from(frame.querySelectorAll(FOCUSABLE)).filter(el => !overlay.contains(el));
  outsideEls.forEach(el => {
    el._prevTabIndex = el.getAttribute('tabindex');
    el._prevDisabled = el.disabled;
    el.setAttribute('tabindex', '-1');
    if (el.tagName !== 'A' && 'disabled' in el) el.disabled = true;
  });
  overlay._outsideEls = outsideEls;

  // ── FOCUS TRAP — Layer 3: document-level keydown guard (belt-and-suspenders) ──
  // Intercepts Tab at capture phase — fires before any element receives focus.
  const getFocusable = () => Array.from(
    overlay.querySelectorAll('button:not([disabled]),input:not([disabled]),[tabindex]:not([tabindex="-1"])')
  );

  const docKeyHandler = (e) => {
    // Escape to close (unless locked)
    if (e.key === 'Escape' && !lockApp) { removeErrorModals(); return; }
    if (e.key !== 'Tab') return;

    const focusable = getFocusable();
    if (!focusable.length) { e.preventDefault(); return; }

    const first = focusable[0];
    const last  = focusable[focusable.length - 1];
    const active = document.activeElement;

    if (e.shiftKey) {
      // Shift+Tab: if focus is on first (or outside modal), wrap to last
      if (active === first || !overlay.contains(active)) {
        e.preventDefault();
        last.focus();
      }
    } else {
      // Tab: if focus is on last (or outside modal), wrap to first
      if (active === last || !overlay.contains(active)) {
        e.preventDefault();
        first.focus();
      }
    }
  };
  document.addEventListener('keydown', docKeyHandler, true); // capture phase
  overlay._docKeyHandler = docKeyHandler;

  // ── FOCUS TRAP — Layer 4: focusin guard ──
  // If focus somehow lands outside the modal (e.g. browser quirk), yank it back.
  const docFocusHandler = (e) => {
    if (document.getElementById('swak-error-modal') && !overlay.contains(e.target)) {
      e.stopPropagation();
      const focusable = getFocusable();
      if (focusable.length) focusable[0].focus();
    }
  };
  document.addEventListener('focusin', docFocusHandler, true);
  overlay._docFocusHandler = docFocusHandler;

  // ── Initial focus ──
  requestAnimationFrame(() => {
    const firstBtn = overlay.querySelector('button:not([disabled])');
    if (firstBtn) firstBtn.focus();
  });
}

function showQuotaExceededModal(tokensUsed, tokensLimit) {
  // Store values for re-render on language change
  window._lastQuotaUsed  = tokensUsed;
  window._lastQuotaLimit = tokensLimit;
  window._quotaModalOpen = true;
  _renderQuotaModal();
}

function _renderQuotaModal() {
  if (!window._quotaModalOpen) return;
  // Temporarily suppress quota flag clear so removeErrorModals doesn't kill the re-render loop
  const _prev = window._quotaModalOpen;
  removeErrorModals();
  window._quotaModalOpen = _prev;
  const used  = window._lastQuotaUsed  || 0;
  const limit = window._lastQuotaLimit || 0;
  const pct   = limit > 0 ? Math.min(100, Math.round(used/limit*100)) : 100;
  showErrorModal({
    icon: '🤖',
    title:   t('quotaExceededTitle') || 'AI Quota Exceeded',
    message: `<div style="margin-bottom:10px">${t('quotaExceededMsg')||'Monthly AI tokens exhausted.'}</div>
              <div style="background:#1a1a2e22;border-radius:6px;padding:8px;font-size:10px;margin-bottom:4px">
                <div style="display:flex;justify-content:space-between;margin-bottom:4px">
                  <span>${t('quotaUsage')||'Usage'}</span>
                  <span>${used.toLocaleString()} / ${limit.toLocaleString()}</span>
                </div>
                <div style="background:#333;border-radius:4px;height:4px">
                  <div style="background:#EF4444;height:4px;border-radius:4px;width:${pct}%"></div>
                </div>
              </div>`,
    btnText:   t('quotaExceededBtn') || 'Buy More Tokens',
    btnAction: "window.open('https://swaksoft.com/license#tokens','_blank')",
    color: '#EF4444',
  });
}

// Re-render quota modal when language changes
const _origLangChange = typeof window._onLangChange === 'function' ? window._onLangChange : null;
window._onLangChange = function() {
  if (_origLangChange) _origLangChange();
  if (window._quotaModalOpen) _renderQuotaModal();
};

async function simulateActivation(){
  const v=sanitizeLicenseInput(document.getElementById('keyIn')?.value||'');
  // لایه اول: بررسی _keyValid
  if(!window._keyValid){showT('error',t('toastInvalidKey'));return;}
  // لایه دوم: بررسی مستقل فرمت (حتی اگر دکمه به زور فعال شده باشد)
  if(!isValidLicenseFormat(v)){showT('error',t('toastInvalidKey'));return;}

  // Check internet before attempting
  if(!navigator.onLine) {
    showErrorModal({
      icon:'📡',
      title: t('offlineTitle')||'No Internet Connection',
      message: t('offlineDesc')||'Please check your internet connection and try again.',
      btnText: t('retryConnection')||'Retry',
      btnAction: 'simulateActivation()',
      color:'#6B7280'
    });
    return;
  }

  window._keyState='validating';
  rf(false);

  try {
    const resp = await validateLicenseFromServer(v);

    if(resp.errorCode === 'INVALID_DEVICE') {
      showDeviceTamperingModal();
      window._keyState='idle';
      rf(false);
      return;
    }

    if(resp.errorCode === 'NETWORK_ERROR') {
      window._keyState='error';
      window._keyErrorCode='NETWORK_ERROR';
      rf(false);
      return;
    }
    if(resp.errorCode === 'TIMEOUT') {
      window._keyState='error';
      window._keyErrorCode='TIMEOUT';
      rf(false);
      return;
    }
    if(resp.errorCode === 'INVALID_ANON_KEY' || resp.errorCode === 'SERVER_ERROR') {
      window._keyState='error';
      window._keyErrorCode='SERVER_ERROR';
      rf(false);
      return;
    }

    if(resp.valid) {
      applyServerLicense(resp, v);
      saveKeyToStorage(v);
      window._keyState='success';
      window._keyErrorCode='';
      rf(false);
    } else {
      window._keyState='error';
      window._keyErrorCode=resp.errorCode||'INVALID_KEY';
      // Show specific error modal for serious errors
      if(['LICENSE_REVOKED','LICENSE_SUSPENDED','RATE_LIMITED','DEVICE_CONFLICT'].includes(resp.errorCode)) {
        setTimeout(()=>showLicenseErrorModal(resp.errorCode), 400);
      }
      rf(false);
    }
  } catch(e) {
    window._keyState='error';
    window._keyErrorCode='SERVER_ERROR';
    rf(false);
  }
}

let _tt=null;

function showProNearEl(el, msg) {
  // Remove any existing pro tooltip
  const existing = document.getElementById('swak-pro-tip');
  if (existing) existing.remove();

  const tip = document.createElement('div');
  tip.id = 'swak-pro-tip';
  tip.innerHTML = msg + ` <a href="https://swaksoft.com/upgrade" onclick="event.stopPropagation()" style="color:inherit;font-weight:700;text-decoration:none"> ${(I18N[lang]||I18N['en']).toastUpgradeLink}</a>`;

  const isDarkNow = document.body.classList.contains('dark') || isDark;
  Object.assign(tip.style, {
    position: 'fixed',
    background: isDarkNow ? '#1C1700' : '#FFF8C5',
    border: '1px solid #F59E0B',
    color: '#F59E0B',
    borderRadius: '7px',
    padding: '7px 11px',
    fontSize: '11px',
    lineHeight: '1.5',
    zIndex: '9999',
    boxShadow: '0 4px 16px rgba(0,0,0,0.25)',
    maxWidth: '260px',
    pointerEvents: 'auto',
    animation: 'fadeIn .15s ease',
  });

  document.body.appendChild(tip);

  // Measure actual rendered size
  tip.style.visibility = 'hidden';
  tip.style.display = 'block';
  const tipW = Math.min(tip.offsetWidth || 260, 280);
  const tipH = tip.offsetHeight || 52;
  tip.style.visibility = '';

  const rect = el ? el.getBoundingClientRect() : null;
  const margin = 10;
  const vw = window.innerWidth;
  const vh = window.innerHeight;

  if (rect) {
    // Center horizontally on the clicked element
    const elCenterX = rect.left + rect.width / 2;
    let left = elCenterX - tipW / 2;

    // Keep within viewport
    if (left + tipW > vw - 8) left = vw - tipW - 8;
    if (left < 8) left = 8;

    // Prefer showing BELOW the element (closer to where they clicked)
    let top = rect.bottom + margin;

    // If not enough space below, show above
    if (top + tipH > vh - 8) top = rect.top - tipH - margin;

    // Final safety clamp
    if (top < 8) top = 8;

    tip.style.top = top + 'px';
    tip.style.left = left + 'px';
  } else {
    // fallback: center horizontally, near top
    tip.style.top = '60px';
    tip.style.left = '50%';
    tip.style.transform = 'translateX(-50%)';
  }

  // Auto-dismiss after 4s
  setTimeout(() => { if (tip.parentNode) tip.remove(); }, 4000);
  // Click anywhere to dismiss
  const dismiss = (e) => { if (!tip.contains(e.target)) { tip.remove(); document.removeEventListener('click', dismiss); } };
  setTimeout(() => document.addEventListener('click', dismiss), 100);
}

// ── Backend config ────────────────────────────────────────────────────────
const SWAK_BACKEND = 'http://127.0.0.1:5000';
let   _backendAlive = null; // null=unknown, true/false

// Tier → backend route map
const TIER_ROUTE = {
  'data-cleaning':    '/api/clean',
  'filter-search':    '/api/filter',
  'transform':        '/api/transform',
  'statistics':       '/api/stats',
  'machine-learning': '/api/ml',
  'visualization':    '/api/viz',
  'ai-insights':      '/api/ai',
  'data-import':      '/api/import',
  'data-export':      '/api/export',
  'data-profiling':   '/api/profiling',
  'data-engineering': '/api/dataeng',
  'productivity':     '/api/productivity',
};

async function _checkBackend() {
  if (_backendAlive !== null) return _backendAlive;
  try {
    const r = await fetch(SWAK_BACKEND+'/health', {signal: AbortSignal.timeout(2500)});
    _backendAlive = r.ok;
  } catch(_) { _backendAlive = false; }
  return _backendAlive;
}

async function _callBackend(tierId, toolId, params, headers, rows) {
  const route = TIER_ROUTE[tierId];
  if (!route) throw new Error('Unknown tier: '+tierId);
  const body = JSON.stringify({
    tool_id: toolId,
    params,
    headers,
    rows,
    license_key: licenseState.licenseKey || null,
  });
  const resp = await fetch(SWAK_BACKEND+route, {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body,
    signal: AbortSignal.timeout(30000),
  });
  if (resp.status === 429) {
    const err = await resp.json().catch(()=>({}));
    if (err.error === 'quota_exceeded') {
      showQuotaExceededModal(err.tokens_used||0, err.tokens_limit||0);
      throw new Error('quota_exceeded');
    }
  }
  if (!resp.ok) {
    const err = await resp.json().catch(()=>({error: resp.statusText}));
    throw new Error(err.error || 'Server error '+resp.status);
  }
  const data = await resp.json();
  if (data.error === 'quota_exceeded') {
    showQuotaExceededModal(data.tokens_used||0, data.tokens_limit||0);
    throw new Error('quota_exceeded');
  }
  return data;
}

// ── Excel read / write helpers (Office.js) ───────────────────────────────
async function _excelReadSheet() {
  return new Promise((resolve, reject) => {
    if (typeof Excel === 'undefined') {
      // Dev/preview mode — return demo data
      resolve({
        headers: window.DEMO_COLS || ['ID','Name','Value','Category','Date'],
        rows:    Array.from({length:20},(_,i)=>[i+1,'Item '+(i+1),Math.round(Math.random()*1000),'Cat '+(i%3+1),'2024-0'+(i%9+1)+'-01']),
      });
      return;
    }
    Excel.run(async ctx => {
      try {
        const sheet = ctx.workbook.worksheets.getActiveWorksheet();
        const used  = sheet.getUsedRange();
        used.load(['values','rowCount','columnCount']);
        await ctx.sync();
        const vals = used.values;
        if (!vals || !vals.length) return resolve({headers:[],rows:[]});
        resolve({headers: vals[0].map(h=>String(h||'')), rows: vals.slice(1)});
      } catch(e) { reject(e); }
    });
  });
}

async function _excelWriteResult(resultHeaders, resultRows) {
  if (typeof Excel === 'undefined') return; // preview mode — skip write
  return new Promise((resolve, reject) => {
    Excel.run(async ctx => {
      try {
        const sheet = ctx.workbook.worksheets.getActiveWorksheet();
        sheet.getUsedRange().clear();
        const allRows = [resultHeaders, ...resultRows];
        const range   = sheet.getRangeByIndexes(0,0,allRows.length,resultHeaders.length);
        range.values  = allRows;
        const hdrRng  = sheet.getRangeByIndexes(0,0,1,resultHeaders.length);
        hdrRng.format.font.bold = true;
        hdrRng.format.fill.color = '#1a1a3e';
        hdrRng.format.font.color = '#ffffff';
        sheet.getUsedRange().format.autofitColumns();
        await ctx.sync();
        resolve();
      } catch(e) { reject(e); }
    });
  });
}

async function _excelAddSheet(name, headers, rows) {
  if (typeof Excel === 'undefined') return;
  return new Promise((resolve, reject) => {
    Excel.run(async ctx => {
      try {
        let ws;
        try {
          const ex = ctx.workbook.worksheets.getItem(name);
          ex.delete(); await ctx.sync();
        } catch(_){}
        ws = ctx.workbook.worksheets.add(name);
        ws.activate();
        const all = [headers,...rows];
        ws.getRangeByIndexes(0,0,all.length,headers.length).values = all;
        ws.getRangeByIndexes(0,0,1,headers.length).format.font.bold = true;
        ws.getUsedRange().format.autofitColumns();
        await ctx.sync();
        resolve();
      } catch(e) { reject(e); }
    });
  });
}

// ── Download helper for export tools ─────────────────────────────────────
function _triggerDownload(filename, mimeType, b64Content) {
  try {
    const bytes   = atob(b64Content);
    const arr     = new Uint8Array(bytes.length);
    for (let i=0;i<bytes.length;i++) arr[i]=bytes.charCodeAt(i);
    const blob    = new Blob([arr],{type:mimeType});
    const url     = URL.createObjectURL(blob);
    const a       = document.createElement('a');
    a.href=url; a.download=filename; a.click();
    setTimeout(()=>URL.revokeObjectURL(url),3000);
  } catch(e) { console.warn('Download failed:',e); }
}

// ── MAIN runTool ──────────────────────────────────────────────────────────
async function runTool(tierId, toolId, isPro){
  // ── Guard 1: Runtime check — every single tool click ──────────────────
  const runtimeOk = await guardRuntime();
  if (!runtimeOk) return; // guardRuntime already shows runtime-gate screen

  const actuallyPro = isPlanPro();
  const tier  = TIERS.find(tr=>tr.id===tierId);
  const tool  = tier?.tools.find(tr=>tr.id===toolId);

  // License gate
  if(tool && !tool.free && !actuallyPro) {
    showT('error', t('upgradeRequired')||'Upgrade to Pro to use this tool.');
    rf(false);
    return;
  }
  if(!canRunTool(toolId)) return;

  const toolColor = tier?.color||'#4ADE80';

  // Pro license check
  if(actuallyPro) {
    const savedKey = licenseState.licenseKey ||
      (()=>{ try{return localStorage.getItem('swak_license_key');}catch(e){return null;} })();
    _showRunStep(toolColor,'🔐',t('processing')||'Processing…',null);
    const authOk = await verifyLicenseBeforeRun(savedKey);
    if(!authOk) return;
  }

  // ── Check backend ────────────────────────────────────────────────────
  const backendOk = await _checkBackend();

  if (backendOk) {
    // ══ REAL BACKEND PATH ══════════════════════════════════════════════
    try {
      // Step 1: Read Excel
      _showRunStep(toolColor,'📊',t('readingData')||'Reading Excel data…',null);
      const {headers, rows} = await _excelReadSheet();

      // Step 2: Call Python backend
      _showRunStep(toolColor,'⚙',t('processingData')||'Processing…',toolId.replace(/-/g,' '));
      const result = await _callBackend(tierId, toolId, {...paramValues}, headers, rows);

      // Step 3: Write result back to Excel
      _showRunStep(toolColor,'✓',t('writingResult')||'Writing to Excel…',null);

      if (result.new_sheet && result.new_sheet.headers && result.new_sheet.rows) {
        await _excelAddSheet(result.new_sheet.name, result.new_sheet.headers, result.new_sheet.rows);
      } else if (result.headers && result.rows) {
        await _excelWriteResult(result.headers, result.rows);
      }

      // Handle file download (export tools)
      if (result.download?.content_b64) {
        _triggerDownload(result.download.filename, result.download.mime_type, result.download.content_b64);
      }

      // Handle Office.js commands (productivity tools)
      if (result.office_commands) {
        await _applyOfficeCommands(result.office_commands, headers, rows);
      }

      // Store result for result panel
      _storeBackendResult(result.summary || result);

      await new Promise(r=>setTimeout(r,250));
      showResult = true;
      rf(isPro);

    } catch(err) {
      console.error('SWAK backend error:', err);
      if (err.message === 'quota_exceeded') {
        // Quota modal already shown — just reset UI
        showResult = false;
        rf(isPro);
        return;
      }
      _showRunStep('#F87171','❌','Error: '+err.message.substring(0,60),null);
      await new Promise(r=>setTimeout(r,2000));
      showResult = false;
      rf(isPro);
    }

  } else {
    // ══ SIMULATION FALLBACK (no backend) ══════════════════════════════
    _showRunStep(toolColor,'📊',t('readingData')||'Reading Excel data…','demo mode');
    await new Promise(r=>setTimeout(r,300));
    _showRunStep(toolColor,'⚙',t('processingData')||'Processing…',toolId.replace(/-/g,' '));
    await new Promise(r=>setTimeout(r,400));
    _showRunStep(toolColor,'✓',t('writingResult')||'Writing to Excel…',null);
    await new Promise(r=>setTimeout(r,300));
    _storeBackendResult(null);
    showResult = true;
    rf(isPro);
  }
}

// ── Apply Office.js commands from productivity module ────────────────────
async function _applyOfficeCommands(commands, headers, rows) {
  if (typeof Excel === 'undefined') return;
  for (const cmd of commands) {
    try {
      await Excel.run(async ctx => {
        const sheet = ctx.workbook.worksheets.getActiveWorksheet();
        if (cmd.action === 'freeze_panes') {
          sheet.freezePanes.freezeRows(cmd.row||1);
          if (cmd.col>0) sheet.freezePanes.freezeColumns(cmd.col);
        } else if (cmd.action === 'add_autofilter') {
          sheet.autoFilter.apply(sheet.getUsedRange());
        } else if (cmd.action === 'protect_sheet') {
          sheet.protection.protect({
            allowAutoFilter: true,
            allowSort: true,
            allowSelectLockedCells: cmd.allow_select,
            allowSelectUnlockedCells: true,
          }, cmd.password || '');
        } else if (cmd.action === 'clear_formatting') {
          sheet.getUsedRange().format.fill.clear();
          sheet.getUsedRange().format.font.color = '';
          sheet.getUsedRange().format.font.bold  = false;
        } else if (cmd.action === 'apply_format' && cmd.formats) {
          const pal = cmd.palette;
          // Apply header style
          const hdrRng = sheet.getRangeByIndexes(0,0,1,headers.length);
          hdrRng.format.fill.color = pal.header_bg;
          hdrRng.format.font.color = pal.header_fg;
          hdrRng.format.font.bold  = true;
          // Apply column number formats
          for (const f of cmd.formats) {
            const colRng = sheet.getRangeByIndexes(1,f.col_index,rows.length,1);
            colRng.numberFormat = [[f.number_fmt]];
          }
        } else if (cmd.action === 'conditional_format' && cmd.instructions) {
          for (const ins of cmd.instructions) {
            if (!ins.row||!('col' in ins)) continue;
            const cell = sheet.getRangeByIndexes(ins.row,ins.col,1,1);
            if (ins.bg_color) cell.format.fill.color = ins.bg_color;
          }
        }
        await ctx.sync();
      });
    } catch(e) { console.warn('Office command failed:', cmd.action, e); }
  }
}

let runtimeAvailable = null;   // null=unknown, true/false
let runtimeCheckInProgress = false;
const RUNTIME_HEALTH_URL = 'http://127.0.0.1:5000/health';
const RUNTIME_DOWNLOAD_URL       = 'https://swaksoft.com/download/runtime';
const RUNTIME_DOWNLOAD_URL_DIRECT = 'https://cdn.swaksoft.com/releases/SWAK_Runtime_Setup_latest.exe';
// گزینه A: swaksoft.com/download/runtime → redirect به CDN فایل installer
// وقتی نسخه عوض می‌شود فقط redirect وب‌سایت آپدیت می‌شود، نه این کد
const RUNTIME_CHECK_TIMEOUT = 2500; // ms

// Runtime check — lightweight, called on startup + every tool click
async function checkRuntime(forceRecheck = false) {
  if (runtimeAvailable === true && !forceRecheck) return true;
  if (runtimeCheckInProgress) return runtimeAvailable === true;
  runtimeCheckInProgress = true;
  try {
    const r = await fetch(RUNTIME_HEALTH_URL, {
      signal: AbortSignal.timeout(RUNTIME_CHECK_TIMEOUT),
      cache: 'no-store',
    });
    runtimeAvailable = r.ok;
  } catch(_) {
    runtimeAvailable = false;
  }
  runtimeCheckInProgress = false;
  return runtimeAvailable;
}

// ── Runtime Download with Progress ───────────────────────────────────────
async function startRuntimeDownload() {
  const btnWrap  = document.getElementById('swak-dl-btn-wrap');
  const progress = document.getElementById('swak-dl-progress');
  const bar      = document.getElementById('swak-dl-bar');
  const pct      = document.getElementById('swak-dl-pct');
  const done     = document.getElementById('swak-dl-done');
  const errBox   = document.getElementById('swak-dl-error');

  if (!btnWrap || !progress) {
    // Fallback if DOM not ready
    window.open(RUNTIME_DOWNLOAD_URL, '_blank');
    return;
  }

  // Show progress bar
  btnWrap.style.display  = 'none';
  progress.style.display = 'block';
  done.style.display     = 'none';
  errBox.style.display   = 'none';

  try {
    // Fetch with progress tracking
    const response = await fetch(RUNTIME_DOWNLOAD_URL);

    if (!response.ok) throw new Error(`HTTP ${response.status}`);

    const contentLength = response.headers.get('Content-Length');
    const total         = contentLength ? parseInt(contentLength) : 0;
    const reader        = response.body.getReader();
    const chunks        = [];
    let   received      = 0;

    while (true) {
      const { done: streamDone, value } = await reader.read();
      if (streamDone) break;
      chunks.push(value);
      received += value.length;

      // Update progress bar
      if (total > 0) {
        const p = Math.round((received / total) * 100);
        bar.style.width = p + '%';
        pct.textContent = p + '%';
      } else {
        // Unknown size — animate
        const p = Math.min(90, Math.round((received / (10 * 1024 * 1024)) * 100));
        bar.style.width = p + '%';
        pct.textContent = _formatBytes(received) + ' downloaded...';
      }
    }

    // Combine chunks
    bar.style.width = '100%';
    pct.textContent = '100%';
    const blob     = new Blob(chunks);
    const url      = URL.createObjectURL(blob);
    const filename = RUNTIME_DOWNLOAD_URL.split('/').pop() || 'SWAK_Runtime_Setup.exe';

    // Trigger browser download
    const a    = document.createElement('a');
    a.href     = url;
    a.download = filename;
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 5000);

    // Show done state
    await new Promise(r => setTimeout(r, 500));
    progress.style.display = 'none';
    done.style.display     = 'block';

    // Auto re-check after 30s (enough time to run installer)
    setTimeout(() => {
      recheckRuntime();
    }, 30000);

  } catch (err) {
    console.error('[SWAK] Download failed:', err);
    progress.style.display = 'none';
    errBox.style.display   = 'block';
    // Fallback to manual download
    setTimeout(() => window.open(RUNTIME_DOWNLOAD_URL, '_blank'), 500);
  }
}

function _formatBytes(bytes) {
  if (bytes < 1024)        return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(0) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}

// ── Re-check runtime (called by retry button) ─────────────────────────────
async function recheckRuntime() {
  // Show spinner on retry button
  const frame = document.getElementById('frame');
  runtimeAvailable = null;
  appStarting = true;
  startupStatus = 'connecting';
  rf(false);
  await new Promise(r => setTimeout(r, 400));
  const ok = await checkRuntime(true);
  appStarting = false;
  if (ok) {
    // Runtime found — disable protection and continue
    _deactivateAntiTamper();
    startupStatus = 'ready';
    rf(false);
    await new Promise(r => setTimeout(r, 300));
    await _postRuntimeStartup();
  } else {
    // Still not found — stay on gate
    currentScreen = 'runtime-gate';
    rf(false);
  }
}

// Post-runtime startup (license check etc.)
async function _postRuntimeStartup() {
  let savedKey = null;
  try { savedKey = localStorage.getItem('swak_license_key'); } catch(e){}
  if (!savedKey) {
    show('onboarding');
    return;
  }
  startupStatus = 'checking';
  rf(false);
  try {
    const resp = await validateLicenseFromServer(savedKey);
    appStarting = false;
    handleAuthResult(resp, savedKey, () => {
      startupStatus = 'ready';
      rf(false);
      if (isPlanPro()) {
        show('app-pro');
        startLicensePolling(savedKey);
      } else {
        show('app');
      }
    });
  } catch(e) {
    appStarting = false;
    handleAuthResult(null, savedKey, null);
  }
}

// ── TOOL CLICK RUNTIME GUARD ──────────────────────────────────────────────
// Called before every tool execution to guard against mid-session uninstall
async function guardRuntime() {
  const ok = await checkRuntime(false);
  if (!ok) {
    // Runtime disappeared — show gate immediately
    runtimeAvailable = false;
    currentScreen = 'runtime-gate';
    rf(false);
    _activateAntiTamper();
    return false;
  }
  return true;
}

// ── STARTUP TIMEOUT MODAL (locked, not dismissible) ──
// ── ANTI-TAMPER: Runtime Gate Protection ─────────────────────────────────
// Prevents any attempt to hide/remove/bypass the runtime gate via DevTools
let _runtimeGateActive = false;
let _antiTamperObserver = null;

function _activateAntiTamper() {
  _runtimeGateActive = true;

  // 1. Inject global CSS that prevents hiding the gate
  const styleId = '__swak_gate_style';
  if (!document.getElementById(styleId)) {
    const s = document.createElement('style');
    s.id = styleId;
    s.textContent = `
      #swak-runtime-gate {
        display: flex !important;
        visibility: visible !important;
        opacity: 1 !important;
        pointer-events: auto !important;
        z-index: 2147483647 !important;
        position: fixed !important;
        top: 0 !important; left: 0 !important;
        right: 0 !important; bottom: 0 !important;
      }
      body.swak-gate-active * {
        pointer-events: none !important;
      }
      body.swak-gate-active #swak-runtime-gate,
      body.swak-gate-active #swak-runtime-gate * {
        pointer-events: auto !important;
      }
    `;
    document.head.appendChild(s);
  }
  document.body.classList.add('swak-gate-active');

  // 2. MutationObserver — هر تغییری در DOM برگردانده می‌شود
  if (_antiTamperObserver) _antiTamperObserver.disconnect();
  _antiTamperObserver = new MutationObserver((mutations) => {
    if (!_runtimeGateActive) return;
    const gate = document.getElementById('swak-runtime-gate');

    // اگر gate حذف شد، فوری بازسازی کن
    if (!gate) {
      _forceRenderGate();
      return;
    }

    // اگر style عوض شد، برگردان
    const style = gate.style;
    if (style.display === 'none' || style.visibility === 'hidden' ||
        style.opacity === '0' || parseFloat(style.opacity) < 0.5) {
      style.display   = 'flex';
      style.visibility= 'visible';
      style.opacity   = '1';
    }

    // اگر z-index کم شد، برگردان
    if (parseInt(style.zIndex) < 2147483640) {
      style.zIndex = '2147483647';
    }
  });

  _antiTamperObserver.observe(document.body, {
    childList: true,
    subtree:   true,
    attributes: true,
    attributeFilter: ['style', 'class', 'hidden'],
  });

  // 3. setInterval backup — هر ۵۰۰ms بررسی کن
  if (!window._swakGateInterval) {
    window._swakGateInterval = setInterval(() => {
      if (!_runtimeGateActive) {
        clearInterval(window._swakGateInterval);
        window._swakGateInterval = null;
        return;
      }
      const gate = document.getElementById('swak-runtime-gate');
      if (!gate) {
        _forceRenderGate();
      }
    }, 500);
  }
}

function _deactivateAntiTamper() {
  _runtimeGateActive = false;
  if (_antiTamperObserver) {
    _antiTamperObserver.disconnect();
    _antiTamperObserver = null;
  }
  if (window._swakGateInterval) {
    clearInterval(window._swakGateInterval);
    window._swakGateInterval = null;
  }
  document.body.classList.remove('swak-gate-active');
}

function _forceRenderGate() {
  // اگر gate حذف شد، دوباره currentScreen را set کن و render کن
  currentScreen = 'runtime-gate';
  appStarting   = false;
  rf(false);
}

// ── show() override removed — guard added directly to original show() ──

function showServerTimeoutModal() {
  appStarting = false;
  rf(false);
  const frame = document.getElementById('frame');
  if(!frame) return;
  const overlay = document.createElement('div');
  overlay.id = 'swak-timeout-modal';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.88);backdrop-filter:blur(8px);z-index:2147483647;display:flex;align-items:center;justify-content:center;padding:16px';
  overlay.onclick = e => e.stopPropagation();
  const bg = isDark ? '#161B22' : LIGHT.bg2;
  const tc = isDark ? '#e6edf3' : LIGHT.text;
  const sc = isDark ? '#8b949e' : LIGHT.text3;
  const bc = isDark ? '#30363d' : LIGHT.border;
  overlay.innerHTML = `
    <div style="background:${bg};border:1px solid ${bc};border-radius:16px;padding:28px 24px;width:100%;max-width:280px;text-align:center;box-shadow:0 24px 64px rgba(0,0,0,.5)">
      <div style="font-size:38px;margin-bottom:12px">⏱️</div>
      <div style="font-size:14px;font-weight:800;color:${tc};margin-bottom:8px">${t('timeoutTitle')||'Connection Timeout'}</div>
      <div style="font-size:11px;color:${sc};line-height:1.6;margin-bottom:20px">${t('timeoutMsg')||'Could not connect to Swak servers. Please check your connection and try again.'}</div>
      <button onclick="document.getElementById('swak-timeout-modal')?.remove();startupFlow()"
        style="width:100%;padding:10px;background:linear-gradient(135deg,#4ADE80,#22C55E);border:none;border-radius:8px;color:#0D1117;font-weight:800;font-size:12px;cursor:pointer;font-family:inherit;margin-bottom:8px">

      </button>
      <button onclick="window.open('https://swaksoft.com/support','_blank')"

        💬 ${t('contactSupport')||'Contact Support'}
      </button>
    </div>`;
  frame.appendChild(overlay);
}

// ─── Internet reachability check (non-blocking) ───
async function checkInternetReachable() {
  // navigator.onLine is the most reliable signal available in add-in context
  // no-cors fetch is unreliable (always "opaque" response, can't distinguish success/fail)
  // So we trust navigator.onLine + let the actual Supabase RPC confirm connectivity
  return navigator.onLine !== false;
}

async function startupFlow() {
  // Freeze config
  try {
    Object.defineProperty(window, 'APP_NAME', {value: APP_NAME, writable: false, configurable: false});
    Object.defineProperty(window, 'APP_VERSION', {value: APP_VERSION, writable: false, configurable: false});
  } catch(e) {}

  // Remove leftover modals
  ['swak-timeout-modal','swak-error-modal','swak-offline-wall'].forEach(id => {
    document.getElementById(id)?.remove();
  });

  // ── UI PREVIEW MODE: detect standalone browser (not inside Excel add-in) ──
  // In Excel, Office.js is present; in browser preview it's absent.
  // Skip the loading/auth screen entirely and go straight to onboarding.
  const isPreviewMode = typeof Office === 'undefined' || !Office?.context;
  if(isPreviewMode) {
    appStarting = false;
    startupStatus = 'ready';
    isConnected = true;
    show('onboarding');
    const el = document.getElementById('opsCount');
    if(el) el.textContent = totalOps().toLocaleString();
    return;
  }

  appStarting = true;
  startupStatus = 'connecting';
  rf(false);  // show loading screen immediately

  // Tiny delay so browser renders the loading screen
  await new Promise(r => setTimeout(r, 150));

  // ── STEP 1: Check SWAK Runtime (local backend) ──
  startupStatus = 'connecting';
  rf(false);
  const runtimeOk = await checkRuntime(true);
  if (!runtimeOk) {
    appStarting = false;
    startupStatus = 'connecting';
    currentScreen = 'runtime-gate';
    rf(false);
    _activateAntiTamper();
    return;
  }
  // Runtime OK — brief visual confirmation
  await new Promise(r => setTimeout(r, 200));

  // ── STEP 2: Check internet ──
  const hasInternet = await checkInternetReachable();
  if(!hasInternet) {
    // Show offline modal and STOP — no server call
    updateConnectionStatus(false);
    appStarting = false;
    rf(false);
    // Show offline modal (locked)
    const frame = document.getElementById('frame');
    if(frame && !document.getElementById('swak-offline-wall')) {
      const wall = document.createElement('div');
      wall.id = 'swak-offline-wall';
      wall.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.9);backdrop-filter:blur(8px);z-index:2147483645;display:flex;align-items:center;justify-content:center;padding:16px';
      wall.onclick = e => e.stopPropagation();
      const bg = isDark?'#161B22':LIGHT.bg2, tc = isDark?'#e6edf3':LIGHT.text, sc = isDark?'#8b949e':LIGHT.text3, bc = isDark?'#30363d':LIGHT.border;
      wall.innerHTML = `
        <div style="background:${bg};border:1px solid ${bc};border-radius:16px;padding:28px 24px;width:100%;max-width:280px;text-align:center;box-shadow:0 24px 64px rgba(0,0,0,.5)">
          <div style="font-size:38px;margin-bottom:12px">📡</div>
          <div style="font-size:14px;font-weight:800;color:${tc};margin-bottom:8px">${t('offlineTitle')||'No Internet Connection'}</div>
          <div style="font-size:11px;color:${sc};line-height:1.6;margin-bottom:20px">${t('offlineDesc')||'Swak requires internet to verify your license.'}</div>
          <button onclick="document.getElementById('swak-offline-wall')?.remove();startupFlow()"
            style="width:100%;padding:10px;background:linear-gradient(135deg,#4ADE80,#22C55E);border:none;border-radius:8px;color:#0D1117;font-weight:800;font-size:12px;cursor:pointer;font-family:inherit;margin-bottom:8px">
            🔄 ${t('retryConnection')||'Retry'}
          </button>
        </div>`;
      frame.appendChild(wall);
    }
    return;
  }

  // Internet OK — update status
  updateConnectionStatus(true);

  // ── STEP 2: Check for saved license ──
  let savedKey = null;
  try { savedKey = localStorage.getItem('swak_license_key'); } catch(e){}

  if(!savedKey) {
    // No license key — first time user → onboarding, no server call
    startupStatus = 'ready';
    await new Promise(r => setTimeout(r, 350));
    appStarting = false;
    show('onboarding');
    const el = document.getElementById('opsCount');
    if(el) el.textContent = totalOps();
    return;
  }

  // ── STEP 3: Real server call with 20s timeout ──
  startupStatus = 'checking';
  rf(false);

  let serverTimedOut = false;
  const overallTimer = setTimeout(() => {
    serverTimedOut = true;
    appStarting = false;
    rf(false);
    handleAuthResult(null, savedKey, null);
  }, 20000);

  try {
    const resp = await validateLicenseFromServer(savedKey);
    if(serverTimedOut) return;
    clearTimeout(overallTimer);
    appStarting = false;

    // Case 1: No saved key → onboarding (already handled above)
    // Cases 2-5: handleAuthResult shows modal and locks
    // Case 6: success → enter app
    handleAuthResult(resp, savedKey, () => {
      startupStatus = 'ready';
      rf(false);
      if(isPlanPro()) {
        show('app-pro');
        startLicensePolling(savedKey);
        const lastSeen = (() => { try { return localStorage.getItem('swak_last_version'); } catch(e){ return null; } })();
        if(lastSeen !== APP_VERSION) {
          showWhatsNew = true;
          try { localStorage.setItem('swak_last_version', APP_VERSION); } catch(e){}
        }
      } else {
        show('app');
      }
    });
  } catch(e) {
    if(serverTimedOut) return;
    clearTimeout(overallTimer);
    appStarting = false;
    // Network error during RPC
    handleAuthResult(null, savedKey, null);
  }

  const el = document.getElementById('opsCount');
  if(el) el.textContent = totalOps();
}

// Save license key to localStorage after successful activation
function saveKeyToStorage(key) {
  try { localStorage.setItem('swak_license_key', key); } catch(e){}
}
function clearKeyFromStorage() {
  try { localStorage.removeItem('swak_license_key'); } catch(e){}
}

// init
startupFlow();

// ── HARDENED UPDATE GUARD ──
// If update is required: re-inject wall on ANY DOM change
// Cannot be bypassed by JS console or devtools
// Offline wall guard - cannot be bypassed
const offlineGuard = () => {
  if(!isConnected && !appStarting){
    const wall = document.getElementById('swak-offline-wall');
    if(!wall) rf(currentScreen==='app-pro');
    else { wall.style.display='flex'; wall.style.zIndex='2147483645'; }
  }
};
new MutationObserver(offlineGuard).observe(document.body,{childList:true,subtree:true});
document.addEventListener('click', e=>{
  if(!isConnected && !appStarting){
    const wall=document.getElementById('swak-offline-wall');
    if(!wall || !wall.contains(e.target)){
      e.stopImmediatePropagation(); e.preventDefault();
      rf(currentScreen==='app-pro');
    }
  }
}, true);

if(showUpdateModal){
  const guard = () => {
    const wall = document.getElementById('swak-update-wall');
    if(!wall){
      // Wall was removed - re-render immediately
      const overlay = document.createElement('div');
      overlay.id = 'swak-update-wall';
      overlay.innerHTML = document.getElementById('frame').innerHTML.match(/id="swak-update-wall"[^>]*>[\s\S]*?<\/div>\s*<\/div>\s*$/)?.[0]||'';
      // Full re-render
      rf(currentScreen==='app-pro');
    }
    // Also block all click events on frame if wall exists
    const f=document.getElementById('frame');
    if(f && wall){
      wall.style.display='flex';
      wall.style.zIndex='2147483647';
    }
  };
  // Watch for DOM changes
  new MutationObserver(guard).observe(document.body,{childList:true,subtree:true,attributes:true});
  // Also intercept clicks on document level
  document.addEventListener('click', e=>{
    if(showUpdateModal){
      const wall=document.getElementById('swak-update-wall');
      if(!wall || !wall.contains(e.target)){
        e.stopImmediatePropagation();
        e.preventDefault();
        // Re-show wall
        rf(currentScreen==='app-pro');
      }
    }
  }, true);
}
